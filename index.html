Ja","Total":"Summe","despesa":"Ausgabe","Partes ·":"Anteile ·","Uma linha por pessoa em cada despesa. Ideal para tabela dinâmica: Pessoa nas linhas, Mês nas colunas, Parte nos valores.":"Eine Zeile pro Person je Ausgabe. Ideal für eine Pivot-Tabelle: Person in Zeilen, Monat in Spalten, Anteil als Werte.","Mês":"Monat","Pessoa":"Person","Parte":"Anteil","Valor da despesa":"Betrag der Ausgabe","Pagamentos ·":"Zahlungen ·","Acertos já registrados entre as pessoas. Eles baixam o saldo de quem pagou e de quem recebeu.":"Bereits erfasste Ausgleiche zwischen Personen. Sie senken den Saldo von Zahlendem und Empfänger.","Para quem":"An wen","Observação":"Notiz","Registrado por":"Erfasst von","Registrado em":"Erfasst am","pagamento":"Zahlung","Pagamentos":"Zahlungen","wirteilen · histórico do grupo":"wirteilen · Verlauf der Gruppe","Gerado pelo app. Valores em reais (R$).":"Von der App erstellt. Beträge in brasilianischen Real (R$).","Grupo":"Gruppe","Código de convite":"Einladungscode","Criado por":"Erstellt von","Exportado em":"Exportiert am","Versão do app":"App-Version","Pessoas":"Personen","Situação":"Status","Pagou":"Bezahlt","Consumiu":"Verbraucht","Pagamentos feitos":"Geleistete Zahlungen","Pagamentos recebidos":"Erhaltene Zahlungen","Saldo final":"Endsaldo","Criou o grupo":"Hat die Gruppe erstellt","Membro":"Mitglied","Saldo final positivo: a pessoa tem a receber. Negativo: tem a pagar. A soma dos saldos é sempre zero.":"Positiver Endsaldo: Die Person bekommt Geld. Negativ: muss zahlen. Die Summe der Salden ist immer null.","Quem paga":"Wer zahlt","Nenhum: o grupo está acertado.":"Keine: Die Gruppe ist ausgeglichen.","Planilha gerada.":"Tabelle erstellt.","Não foi possível ler a imagem.":"Das Bild konnte nicht gelesen werden.","Esse arquivo não parece ser uma imagem.":"Diese Datei scheint kein Bild zu sein.","Compactando a imagem…":"Bild wird komprimiert…","Ver comprovante":"Beleg ansehen","<b>Comprovante anexado</b>":"<b>Beleg angehängt</b>","Compactado:":"Komprimiert:","(era":"(vorher","Trocar":"Ändern","Remover":"Entfernen","toque para ver":"zum Ansehen tippen","Anexar foto do comprovante":"Belegfoto anhängen","Comprovante (opcional)":"Beleg (optional)","<b>Comprovante</b>":"<b>Beleg</b>","Carregando…":"Wird geladen…","Toque na imagem para ampliar e arraste para ler os detalhes.":"Tipp auf das Bild zum Vergrößern und zieh es, um Details zu lesen.","Comprovante não encontrado. Pode ter sido removido.":"Beleg nicht gefunden. Er wurde vielleicht entfernt.","Sem conexão para baixar o comprovante.":"Keine Verbindung, um den Beleg zu laden.","Idioma":"Sprache","Limpar busca":"Suche löschen","Este grupo foi concluído sem despesas.":"Diese Gruppe wurde ohne Ausgaben abgeschlossen.","Nenhuma despesa ainda. Toque no + no topo da tela para lançar a primeira.":"Noch keine Ausgaben. Tipp oben auf das +, um die erste zu erfassen.","item":"Eintrag","itens":"Einträge","em despesas":"an Ausgaben","Limpar filtros":"Filter löschen","Nada encontrado com esses filtros.":"Mit diesen Filtern nichts gefunden.","Buscar":"Suchen","Filtros":"Filter","Todas":"Alle","Mostrar":"Anzeigen","Despesas e pagamentos":"Ausgaben und Zahlungen","Só despesas":"Nur Ausgaben","Só pagamentos":"Nur Zahlungen","Ordenar":"Sortieren","Mais recentes":"Neueste","Mais antigas":"Älteste","Maior valor":"Höchster Betrag","Menor valor":"Niedrigster Betrag","Nome (A–Z)":"Name (A–Z)","Grupo concluído":"Gruppe abgeschlossen","Concluído em":"Abgeschlossen am","Sua parte":"Dein Anteil","Você pagou":"Du hast bezahlt","Seu saldo final":"Dein Endsaldo","Resumo final":"Abschlussübersicht","Acertos que ficaram pendentes":"Offen gebliebene Ausgleiche","Todos acertaram as contas antes de concluir.":"Alle haben vor dem Abschluss ausgeglichen.","Grupo só para consulta. Ninguém lança, edita ou registra pagamentos. Os outros grupos continuam normais.":"Gruppe nur zur Ansicht. Niemand erfasst, bearbeitet oder bucht Zahlungen. Die anderen Gruppen funktionieren normal.","Concluir grupo":"Gruppe abschließen","Concluir deixa o grupo":"Durch den Abschluss wird die Gruppe","só para consulta: ninguém lança, edita ou registra pagamentos. Todos continuam vendo o resumo completo. Você pode reabrir quando quiser.":"schreibgeschützt: Niemand erfasst, bearbeitet oder bucht Zahlungen. Alle sehen weiterhin die vollständige Übersicht. Du kannst sie jederzeit wieder öffnen.","acerto pendente":"offener Ausgleich","acertos pendentes":"offene Ausgleiche","Eles ficam registrados no resumo final como pendentes.":"Sie bleiben in der Abschlussübersicht als offen stehen.","Todos estão em dia: o grupo fecha zerado.":"Alle sind ausgeglichen: Die Gruppe schließt bei null.","Baixar o Excel antes":"Vorher das Excel herunterladen","Nome da categoria":"Name der Kategorie","Salvar":"Speichern","Sugerir traduções":"Übersetzungen vorschlagen","(ex)":"(ehem.)","você":"dir","Em dia":"Ausgeglichen","Informe o valor da despesa para ver a divisão.":"Gib den Betrag der Ausgabe ein, um die Aufteilung zu sehen.","Marque ao menos uma pessoa.":"Markiere mindestens eine Person.","(centavos ajustados)":"(Cent angepasst)","Dê ao menos uma parte para alguém.":"Gib mindestens einer Person einen Anteil.","parte":"Anteil","por parte":"pro Anteil","Confira os valores digitados.":"Prüf die eingegebenen Beträge.","Os valores fecham com o total.":"Die Beträge ergeben die Summe.","Falta distribuir":"Noch aufzuteilen:","E-mail inválido.":"Ungültige E-Mail.","E-mail ou senha incorretos.":"E-Mail oder Passwort falsch.","Digite a senha.":"Gib das Passwort ein.","O Firebase precisa confirmar o novo e-mail. Tente de novo em instantes.":"Firebase muss die neue E-Mail bestätigen. Versuch es gleich noch einmal.","Por segurança, saia e entre de novo antes de excluir a conta.":"Melde dich aus Sicherheitsgründen ab und wieder an, bevor du das Konto löschst.","Já existe uma conta com esse e-mail. Use Entrar ou Esqueceu a senha?":"Mit dieser E-Mail gibt es schon ein Konto. Nutze Anmelden oder Passwort vergessen?","A senha precisa ter pelo menos 6 caracteres.":"Das Passwort muss mindestens 6 Zeichen haben.","Muitas tentativas. Aguarde alguns minutos e tente de novo.":"Zu viele Versuche. Warte ein paar Minuten und versuch es erneut.","Sem conexão com a internet. Tente de novo quando estiver online.":"Keine Internetverbindung. Versuch es erneut, wenn du online bist.","Sem permissão para essa ação. Confira se você ainda está no grupo e se as regras do Firestore foram publicadas.":"Keine Berechtigung für diese Aktion. Prüf, ob du noch in der Gruppe bist und ob die Firestore-Regeln veröffentlicht wurden.","Sem conexão. Essa ação precisa de internet.":"Keine Verbindung. Diese Aktion braucht Internet.","Copiado":"Kopiert","Não deu para copiar sozinho. Toque e segure o texto para copiar.":"Automatisches Kopieren nicht möglich. Halte den Text gedrückt, um ihn zu kopieren.","Arquivo gerado. Se não aparecer, use Copiar backup.":"Datei erstellt. Wenn sie nicht erscheint, nutze Backup kopieren.","Não foi possível gerar o arquivo aqui. Use Copiar backup.":"Die Datei konnte hier nicht erstellt werden. Nutze Backup kopieren.","Painel":"Bereich","Protegido com Face ID neste aparelho.":"Auf diesem Gerät mit Face ID geschützt.","Entrar com Face ID":"Mit Face ID anmelden","Entrar com e-mail e senha":"Mit E-Mail und Passwort anmelden","Mostrar senha":"Passwort anzeigen","Você recebeu um convite para um grupo (código":"Du hast eine Einladung zu einer Gruppe erhalten (Code","</b>). Entre ou crie sua conta para participar.":"</b>). Melde dich an oder erstelle ein Konto, um beizutreten.","O app ainda não está ligado a uma base online: as contas ficam só neste aparelho. Para usar com os amigos, configure o Firebase (LEIAME).":"Die App ist noch mit keiner Online-Datenbank verbunden: Konten bleiben nur auf diesem Gerät. Für die Nutzung mit Freunden richte Firebase ein (LIESMICH).","Tentar de novo":"Erneut versuchen","Recuperar senha":"Passwort wiederherstellen","Enviamos um link para o seu e-mail. Por ele você cri .":"und wähle den Chat: Es geht ein Bild mit dem Code, und in der Bildunterschrift der Link zur Einladung.","Para chamar alguém só para conhecer o app, use <b>Indicar o wirteilen no WhatsApp</b>, no fim da mesma tela.":"Um jemanden nur zum Ausprobieren einzuladen, nutze <b>wirteilen per WhatsApp empfehlen</b> am Ende desselben Bildschirms.","Instalar o app na tela de início":"App auf dem Home-Bildschirm installieren","Instalado, o wirteilen abre em tela cheia, como um app da App Store, e funciona sem internet.":"Installiert öffnet sich wirteilen im Vollbild wie eine App aus dem App Store und funktioniert offline.","Com o app aberto no <b>Safari</b>, toque em <b>Compartilhar</b>":"Tipp bei geöffneter App in <b>Safari</b> auf <b>Teilen</b>","na barra do navegador.":"in der Browserleiste.","Role a lista e toque em <b>Adicionar à Tela de Início</b>.":"Scroll in der Liste und tipp auf <b>Zum Home-Bildschirm</b>.","Toque em <b>Adicionar</b>. O ícone do wirteilen aparece junto dos outros apps.":"Tipp auf <b>Hinzufügen</b>. Das Symbol von wirteilen erscheint neben deinen anderen Apps.","No Chrome do iPhone essa opção não aparece. Use o Safari para instalar.":"In Chrome auf dem iPhone gibt es diese Option nicht. Installiere mit Safari.","Lançar uma despesa e acertar com Pix":"Ausgabe erfassen und per Pix ausgleichen","Do gasto lançado até o pagamento registrado, com o saldo zerado para todos.":"Von der erfassten Ausgabe bis zur erfassten Zahlung, mit allen Salden auf null.","Lançar":"Erfassen","Aba Despesas — lançar o gasto":"Tab Ausgaben — Ausgabe erfassen","Quem pagou a conta lança. O valor entra no saldo de todos na mesma hora.":"Wer bezahlt hat, erfasst die Ausgabe. Der Betrag fließt sofort in alle Salden ein.","Na aba":"Im Tab",", toque no botão":"tipp auf die Taste","no topo da tela, à direita do nome do grupo.":"oben auf dem Bildschirm, rechts neben dem Gruppennamen.","Escreva a <b>Descrição</b>.":"Schreib die <b>Beschreibung</b>.","Em <b>Valor (R$)</b>, digite só os números, como no app do banco: <b>1 2 0 5 0</b> vira <b>120,50</b>. Use":"Gib unter <b>Betrag (R$)</b> nur die Ziffern ein, wie in der Banking-App: <b>1 2 0 5 0</b> wird zu <b>120,50</b>. Nutze","para dividir ou dobrar o valor digitado.":"um den Betrag zu halbieren oder zu verdoppeln.","Confira a <b>Data</b> e toque no ícone da <b>Categoria</b>.":"Prüf das <b>Datum</b> und tipp auf das Symbol der <b>Kategorie</b>.","Em <b>Quem pagou</b>, toque na pessoa que pagou a conta.":"Tipp unter <b>Wer hat bezahlt</b> auf die Person, die bezahlt hat.","Dividir":"Aufteilen","Escolher como dividir":"Aufteilung wählen","A divisão diz quanto cada um consumiu. Os centavos que sobram de uma divisão são distribuídos para a soma fechar.":"Die Aufteilung zeigt, wie viel jede Person verbraucht hat. Übrige Cent werden verteilt, damit die Summe stimmt.","Em <b>Como dividir</b>, escolha":"Wähle unter <b>Aufteilung</b>","<b>Igual</b>: desmarque quem ficou de fora.":"<b>Gleich</b>: Entferne den Haken bei allen, die nicht dabei sind.","<b>Valores</b>: digite quanto cada um consumiu.":"<b>Beträge</b>: Gib ein, wie viel jede Person verbraucht hat.","<b>Partes</b>: use − e + para dar peso (um casal conta 2 partes).":"<b>Anteile</b>: Mit − und + gewichten (ein Paar zählt 2 Anteile).","Leia a linha abaixo da lista: ela confirma a divisão ou mostra quanto falta.":"Lies die Zeile unter der Liste: Sie bestätigt die Aufteilung oder zeigt, was fehlt.","Em Valores, se a soma não bater com o total, o app não deixa salvar e mostra a diferença.":"Bei Beträgen speichert die App nicht, wenn die Summe nicht stimmt, und zeigt die Differenz.","Repetir":"Wiederholen","Parcelas e aviso ao grupo":"Raten und Benachrichtigung","Uma conta que se repete é lançada uma vez só. O aviso faz os amigos verem a despesa assim que abrirem o app.":"Eine wiederkehrende Rechnung wird nur einmal erfasst. Die Benachrichtigung zeigt die Ausgabe deinen Freunden beim Öffnen der App.","Para parcelas ou conta fixa, em <b>Repetir</b> escolha":"Für Raten oder Fixkosten wähle unter <b>Wiederholen</b>","Toda semana":"Jede Woche","Todo mês":"Jeden Monat","Use − e + para dizer quantas vezes, contando esta. A linha abaixo mostra as datas e o total.":"Mit − und + legst du fest, wie oft, diese mitgezählt. Die Zeile darunter zeigt Daten und Summe.","Ligue <b>Avisar o grupo</b> se quiser que os amigos vejam em <b>Novidades</b>; depois de lançar, dá para mandar a mensagem no WhatsApp.":"Aktiviere <b>Gruppe benachrichtigen</b>, damit deine Freunde es unter <b>Neuigkeiten</b> sehen; danach kannst du die Nachricht per WhatsApp senden.","Cada parcela vira uma despesa própria, no mês em que vence. Para mudar uma parcela, edite só ela.":"Jede Rate wird eine eigene Ausgabe im Monat ihrer Fälligkeit. Um eine Rate zu ändern, bearbeite nur diese.","Aba Saldos — ver quem deve a quem":"Tab Salden — wer schuldet wem","O app cruza todas as despesas e pagamentos e sugere o menor número de transferências para zerar o grupo.":"Die App verrechnet alle Ausgaben und Zahlungen und schlägt die wenigsten Überweisungen zum Ausgleich vor.","Em <b>Saldo de cada um</b>: verde tem a receber, vermelho tem a pagar.":"Unter <b>Saldo aller</b>: Grün bekommt Geld, Rot muss zahlen.","Em <b>Acertos sugeridos</b>, encontre a linha com o seu nome.":"Such unter <b>Vorgeschlagene Ausgleiche</b> die Zeile mit deinem Namen.","Nem sempre você paga para quem pagou a sua conta. O app junta as dívidas para que o grupo faça menos Pix, e cada um termina com o mesmo valor.":"Du zahlst nicht immer der Person, die deinen Anteil bezahlt hat. Die App fasst Schulden zusammen, damit die Gruppe weniger Pix-Überweisungen braucht, und alle landen beim selben Ergebnis.","Pagar com o Pix copia e cola":"Mit dem Pix-Copy-&-Paste-Code zahlen","O código já leva a chave, o nome e o valor do acerto. No banco é só colar e confirmar.":"Der Code enthält schon Schlüssel, Namen und Betrag. In der Bank nur einfügen und bestätigen.","Na sua linha, toque em":"Tipp in deiner Zeile auf","Pagar Caio via Pix":"Caio per Pix zahlen","Copiar código Pix":"Pix-Code kopieren","No app do banco, entre em <b>Pix › Pix copia e cola</b> e cole. O valor já vem preenchido.":"Geh in der Banking-App zu <b>Pix › Pix Copy & Paste</b> und füge ein. Der Betrag ist schon ausgefüllt.","Confira o nome do recebedor e confirme no banco.":"Prüf den Namen des Empfängers und bestätige in der Bank.","O wirteilen não movimenta dinheiro. O pagamento acontece no app do seu banco.":"wirteilen bewegt kein Geld. Die Zahlung passiert in deiner Banking-App.","Registrar o pagamento":"Zahlung erfassen","É o registro que baixa o saldo para todo o grupo. Sem ele, a dívida continua aparecendo.":"Erst die Erfassung senkt den Saldo der ganzen Gruppe. Ohne sie bleibt die Schuld sichtbar.","De volta ao wirteilen, toque em":"Zurück in wirteilen tipp auf","Já pagou? Registrar pagamento":"Schon bezahlt? Zahlung erfassen","O valor já vem preenchido com o que a pessoa deve. Confira quem pagou, para quem e a data; se pagou outro valor, é só trocar.":"Der Betrag ist schon mit der Schuld ausgefüllt. Prüf, wer an wen gezahlt hat, und das Datum; bei einem anderen Betrag einfach ändern.","Se quiser, anexe o comprovante do Pix em":"Wenn du möchtest, häng den Pix-Beleg an unter","Registrou errado? Toque no pagamento na lista e use":"Falsch erfasst? Tipp in der Liste auf die Zahlung und nutze","Excluir pagamento":"Zahlung löschen","(toque duas vezes para confirmar). Só quem registrou pode editar ou excluir.":"(zweimal tippen zum Bestätigen). Nur wer sie erfasst hat, kann sie bearbeiten oder löschen.","Gerenciar o grupo":"Gruppe verwalten","Nome, pessoas, categorias, convite e exclusão com o histórico em Excel.":"Name, Personen, Kategorien, Einladung und Löschen mit dem Verlauf in Excel.","Engrenagem do topo — abrir o grupo":"Zahnrad oben — Gruppe öffnen","Quem criou o grupo gerencia pessoas, nome e categorias. Todos podem convidar e ver as pessoas.":"Wer die Gruppe erstellt hat, verwaltet Personen, Name und Kategorien. Alle können einladen und die Personen sehen.","Em qualquer aba, toque na engrenagem":"Tipp in jedem Tab auf das Zahnrad","A tela <b>Grupo</b> abre com o convite, as pessoas e as categorias.":"Der Bildschirm <b>Gruppe</b> öffnet sich mit Einladung, Personen und Kategorien.","Trocar o nome e convidar":"Namen ändern und einladen","O código de convite e o link vão juntos no e-mail ou na mensagem.":"Einladungscode und Link gehen zusammen in der Nachricht.","Em <b>Nome do grupo</b>, troque o nome e toque em":"Ändere unter <b>Gruppenname</b> den Namen und tipp auf","e escolha a conversa.":"und wähle den Chat.","Remover alguém do grupo":"Jemanden aus der Gruppe entfernen","Quem sai continua nas despesas antigas como ex-membro, e as contas continuam fechando.":"Wer geht, bleibt in alten Ausgaben als ehemaliges Mitglied, und die Abrechnung stimmt weiter.","Na lista <b>Pessoas</b>, veja o saldo de cada um.":"Sieh in der Liste <b>Personen</b> den Saldo jeder Person.","Toque no":"Tipp auf","ao lado da pessoa e toque de novo para confirmar.":"neben der Person und tipp zum Bestätigen erneut.","Quem não criou o grupo vê":"Wer die Gruppe nicht erstellt hat, sieht","Sair do grupo":"Gruppe verlassen","no lugar.":"stattdessen.","Acerte o saldo da pessoa antes de remover: o app avisa quando ela ainda deve ou tem a receber.":"Gleich den Saldo der Person vor dem Entfernen aus: Die App warnt, wenn sie noch schuldet oder Geld bekommt.","Categorias":"Kategorien","Criar categorias do grupo":"Gruppenkategorien erstellen","Além das 20 categorias de base, o grupo pode ter as próprias: Cachorro do sítio, Futebol de quinta, Festa junina.":"Neben den 20 Basiskategorien kann die Gruppe eigene haben: Hund vom Hof, Donnerstagsfußball, Sommerfest.","Em <b>Categorias do grupo</b>, toque em":"Tipp unter <b>Gruppenkategorien</b> auf","Nova categoria":"Neue Kategorie","Escreva o nome, escolha o ícone e a cor e salve.":"Schreib den Namen, wähle Symbol und Farbe und speichere.","Também dá para criar direto no formulário da despesa, no fim da lista de categorias.":"Du kannst sie auch direkt im Ausgabenformular erstellen, am Ende der Kategorienliste.","Excluir":"Löschen","Excluir o grupo com o histórico":"Gruppe mit Verlauf löschen","Excluir apaga o grupo para todos. Antes, o app oferece o histórico completo em planilha.":"Löschen entfernt die Gruppe für alle. Vorher bietet die App den vollständigen Verlauf als Tabelle an.","Excluir grupo":"Gruppe löschen","Baixar histórico completo (Excel)":"Vollständigen Verlauf herunterladen (Excel)","e salve em Arquivos ou no Drive.":"und in Dateien oder Drive speichern.","Excluir o grupo para todos":"Gruppe für alle löschen","e de novo para confirmar.":"und zum Bestätigen erneut.","O Excel traz as abas Resumo (saldo final de cada um e acertos pendentes), Despesas (com a parte de cada pessoa), Partes e Pagamentos. Não dá para desfazer a exclusão.":"Das Excel enthält die Blätter Übersicht (Endsaldo jeder Person und offene Ausgleiche), Ausgaben (mit dem Anteil jeder Person), Anteile und Zahlungen. Löschen lässt sich nicht rückgängig machen.","Foto de perfil e Face ID":"Profilfoto und Face ID","Sua foto ou ícone ao lado do nome e o app aberto com o seu rosto.":"Dein Foto oder Symbol neben deinem Namen, und die App öffnet sich mit deinem Gesicht.","Foto":"Foto","Escolher a foto ou um ícone":"Foto oder Symbol wählen","A foto fica pequena, como no WhatsApp, e aparece para quem está nos seus grupos.":"Das Foto ist klein wie bei WhatsApp und für Personen in deinen Gruppen sichtbar.","Em":"In",", toque na sua foto no topo, com o":"tipp oben auf dein Foto, mit dem","Escolher foto do iPhone":"iPhone-Foto wählen","e escolha na galeria.":"und wähle aus der Galerie.","<b>Enquadre</b>: arraste a foto com o dedo, faça pinça (ou use o controle) para dar zoom até o rosto ficar bem no círculo. A prévia mostra como fica no app.":"<b>Ausrichten</b>: Zieh das Foto mit dem Finger, zoom mit zwei Fingern (oder dem Regler), bis das Gesicht im Kreis sitzt. Die Vorschau zeigt, wie es in der App aussieht.","Usar esta foto":"Dieses Foto verwenden","Ou escolha um ícone e uma cor e toque em":"Oder wähle ein Symbol und eine Farbe und tipp auf","Usar este ícone":"Dieses Symbol verwenden","Ligar o Face ID":"Face ID aktivieren","O primeiro acesso é com e-mail e senha. Depois, o Face ID abre o app neste iPhone.":"Die erste Anmeldung erfolgt mit E-Mail und Passwort. Danach öffnet Face ID die App auf diesem iPhone.",", no bloco <b>Conta e acesso</b>, ligue <b>Entrar com Face ID</b>.":"aktiviere im Bereich <b>Konto und Zugang</b> die Option <b>Mit Face ID anmelden</b>.","Confirme o rosto quando o iPhone pedir.":"Bestätige dein Gesicht, wenn das iPhone fragt.","Na próxima abertura, toque em":"Beim nächsten Öffnen tipp auf","Funciona com o app aberto pelo endereço publicado (https). Depois de 5 minutos fora do app, ele pede o rosto de novo. Se falhar, entre com e-mail e senha.":"Funktioniert, wenn die App über die veröffentlichte Adresse (https) geöffnet wird. Nach 5 Minuten außerhalb der App fragt sie erneut nach dem Gesicht. Wenn es nicht klappt, melde dich mit E-Mail und Passwort an.","Fazer e restaurar o backup":"Backup erstellen und wiederherstellen","Guardar uma cópia do grupo fora do app e trazê-la de volta quando precisar.":"Eine Kopie der Gruppe außerhalb der App aufbewahren und bei Bedarf zurückholen.","Aba Backup — exportar o backup":"Tab Backup — Backup exportieren","O backup é uma cópia completa do grupo: despesas, divisões e pagamentos.":"Das Backup ist eine vollständige Kopie der Gruppe: Ausgaben, Aufteilungen und Zahlungen.","Na folha do iPhone, escolha <b>Salvar em Arquivos</b> ou o app do <b>Google Drive</b>.":"Wähle im iPhone-Menü <b>In Dateien sichern</b> oder die App <b>Google Drive</b>.","Para analisar no Excel, use":"Zum Auswerten in Excel nutze","Sem lugar para salvar?":"Kein Speicherort?","copia o conteúdo para colar num e-mail ou nota.":"kopiert den Inhalt zum Einfügen in eine E-Mail oder Notiz.","Abrir o backup para restaurar":"Backup zum Wiederherstellen öffnen","O app lê o arquivo e mostra um resumo antes de mexer em qualquer dado.":"Die App liest die Datei und zeigt eine Übersicht, bevor Daten geändert werden.",", no bloco <b>Ler e restaurar</b>, toque em":"tipp im Bereich <b>Lesen und wiederherstellen</b> auf","Ou cole o conteúdo copiado no campo de texto e toque em":"Oder füge den kopierten Inhalt ins Textfeld ein und tipp auf","Confira o resumo: grupo, data, quantidade de despesas e o total.":"Prüf die Übersicht: Gruppe, Datum, Anzahl der Ausgaben und Summe.","Conferir as pessoas do backup":"Personen im Backup prüfen","Aparece quando o backup tem gente que não está neste grupo, como ao recriar o grupo do zero.":"Erscheint, wenn das Backup Personen enthält, die nicht in dieser Gruppe sind, etwa wenn die Gruppe neu angelegt wird.","Para cada nome listado, escolha quem é essa pessoa no grupo atual.":"Wähle für jeden Namen, wer diese Person in der aktuellen Gruppe ist.","O app já sugere pelo nome. Confira cada um.":"Die App schlägt nach Namen vor. Prüf jeden.","Se a pessoa saiu do grupo, deixe <b>Manter como ex-membro</b>.":"Wenn die Person die Gruppe verlassen hat, lass <b>Als ehemaliges Mitglied behalten</b>.","Restaurar":"Wiederherstellen","Escolher o modo e restaurar":"Modus wählen und wiederherstellen","Mesclar repõe o que veio no backup sem apagar o resto. Substituir deixa o grupo idêntico ao backup.":"Zusammenführen stellt den Inhalt des Backups wieder her, ohne den Rest zu löschen. Ersetzen macht die Gruppe identisch mit dem Backup.","Escolha <b>Mesclar</b> ou, se você criou o grupo, <b>Substituir tudo</b>.":"Wähle <b>Zusammenführen</b> oder, wenn du die Gruppe erstellt hast, <b>Alles ersetzen</b>.","Restaurar agora":"Jetzt wiederherstellen","No Substituir tudo, toque de novo no botão para confirmar.":"Bei Alles ersetzen zum Bestätigen erneut tippen.","Restaurar precisa de internet. Substituir tudo apaga para todos as despesas que não estão no backup.":"Wiederherstellen braucht Internet. Alles ersetzen löscht für alle die Ausgaben, die nicht im Backup sind.","Automático":"Automatisch","Usar as cópias automáticas do aparelho":"Automatische Kopien des Geräts nutzen","O app guarda sozinho até 8 versões do grupo neste aparelho, sempre que os dados mudam.":"Die App bewahrt automatisch bis zu 8 Versionen der Gruppe auf diesem Gerät auf, bei jeder Änderung.",", veja <b>Cópias automáticas neste aparelho</b>. Cada linha mostra data, hora e quantidade de despesas.":"sieh unter <b>Automatische Kopien auf diesem Gerät</b> nach. Jede Zeile zeigt Datum, Uhrzeit und Anzahl der Ausgaben.","na versão desejada e siga as etapas 3 e 4.":"bei der gewünschten Version und folge den Schritten 3 und 4.","Ou toque em":"Oder tipp auf","para guardar a cópia fora do celular.":"um die Kopie außerhalb des Handys aufzubewahren.","As cópias automáticas ficam só neste aparelho. Limpar os dados do Safari apaga as cópias; o backup exportado é o que fica guardado de verdade.":"Automatische Kopien bleiben nur auf diesem Gerät. Wenn du die Safari-Daten löschst, sind sie weg; dauerhaft gesichert ist nur das exportierte Backup.","Recuperar a senha":"Passwort wiederherstellen","Do link pedido na tela de entrada até entrar de novo com a senha nova.":"Vom Link auf dem Anmeldebildschirm bis zur Anmeldung mit dem neuen Passwort.","Entrada":"Anmeldung","Pedir o link na tela de entrada":"Link auf dem Anmeldebildschirm anfordern","A senha não é enviada nem mostrada. O link permite criar uma senha nova.":"Das Passwort wird nie gesendet oder angezeigt. Über den Link legst du ein neues fest.","Na tela de entrada, toque em":"Tipp auf dem Anmeldebildschirm auf","Digite o e-mail da conta.":"Gib die E-Mail des Kontos ein.","Abrir o e-mail e criar a senha nova":"E-Mail öffnen und neues Passwort festlegen","O e-mail chega em português, enviado pelo Firebase em nome do app.":"Die E-Mail kommt auf Deutsch, von Firebase im Namen der App.","Abra o e-mail de redefinição de senha. Confira também o spam.":"Öffne die E-Mail zum Zurücksetzen des Passworts. Sieh auch im Spam nach.","Toque no link.":"Tipp auf den Link.","Digite a senha nova e salve.":"Gib das neue Passwort ein und speichere.","O link vale por tempo limitado. Se expirar, peça outro na tela de entrada.":"Der Link ist begrenzt gültig. Wenn er abläuft, fordere auf dem Anmeldebildschirm einen neuen an.","Voltar ao app":"Zurück zur App","A senha antiga deixa de valer em todos os aparelhos.":"Das alte Passwort gilt auf keinem Gerät mehr.","Volte ao wirteilen e entre com o e-mail e a senha nova.":"Geh zurück zu wirteilen und melde dich mit E-Mail und neuem Passwort an.","Já logado, dá para trocar a senha em":"Angemeldet kannst du das Passwort ändern unter","› <b>Conta e acesso</b> › Senha ›":"› <b>Konto und Zugang</b> › Passwort ›","O número grande no topo da aba Despesas.":"Die große Zahl oben im Tab Ausgaben.","Soma tudo o que você pagou pelo grupo e subtrai a sua parte em cada despesa e os pagamentos já registrados.":"Addiert alles, was du für die Gruppe bezahlt hast, und zieht deinen Anteil an jeder Ausgabe sowie erfasste Zahlungen ab.","Com sinal de mais, é o que os amigos te devem (você pagou mais do que consumiu); com sinal de menos, o que você deve. Toque em <b>Acertos</b> para saber para quem pagar.":"Mit Plus ist es, was dir deine Freunde schulden (du hast mehr bezahlt als verbraucht); mit Minus, was du schuldest. Tipp auf <b>Ausgleiche</b>, um zu sehen, wem du zahlst.","Se você pagou e o saldo continua zero, a divisão incluiu só você: sozinho no grupo, ou só o seu nome marcado. Ao entrar mais gente e lançar dividindo com eles, o valor aparece. O saldo vale para o grupo aberto.":"Wenn du bezahlt hast und der Saldo bei null bleibt, warst nur du in der Aufteilung: allein in der Gruppe oder nur dein Name markiert. Sobald weitere Personen beitreten und du mit ihnen teilst, erscheint der Betrag. Der Saldo gilt für die geöffnete Gruppe.","Selo de em dia":"Abzeichen ausgeglichen","O selo verde ao lado do nome.":"Das grüne Abzeichen neben dem Namen.","Marca quem não deve nada no grupo: saldo zero ou a receber.":"Markiert, wer in der Gruppe nichts schuldet: Saldo null oder Geld zu bekommen.","Aparece nos saldos, nas listas e no seu perfil. Some quando a pessoa passa a dever e volta quando ela registra o pagamento.":"Erscheint in Salden, Listen und deinem Profil. Es verschwindet, sobald die Person etwas schuldet, und kommt zurück, wenn sie die Zahlung erfasst.","Vale para o grupo aberto. Em outro grupo, a mesma pessoa pode estar sem selo.":"Gilt für die geöffnete Gruppe. In einer anderen Gruppe kann dieselbe Person ohne Abzeichen sein.","Parcelas e contas fixas":"Raten und Fixkosten","Repetir toda semana ou todo mês.":"Jede Woche oder jeden Monat wiederholen.","Lança a mesma despesa várias vezes, uma em cada data.":"Erfasst dieselbe Ausgabe mehrmals, je eine pro Datum.","No formulário da despesa, em <b>Repetir</b>, escolha a frequência e quantas vezes. A prévia mostra as datas e o total.":"Wähle im Ausgabenformular unter <b>Wiederholen</b> die Häufigkeit und wie oft. Die Vorschau zeigt Daten und Summe.","Cada parcela é uma despesa própria e pode ser editada ou excluída sozinha.":"Jede Rate ist eine eigene Ausgabe und kann einzeln bearbeitet oder gelöscht werden.","Digitar o valor":"Betrag eingeben","Como no app do banco, com ÷ 2 e × 2.":"Wie in der Banking-App, mit ÷ 2 und × 2.","Os números entram pelos centavos: 1, 2, 0, 5, 0 vira 120,50.":"Die Ziffern kommen von den Cent her: 1, 2, 0, 5, 0 wird zu 120,50.","Ao digitar, aparecem <b>÷ 2</b> e <b>× 2</b>, que dividem ou dobram o valor do campo.":"Beim Tippen erscheinen <b>÷ 2</b> und <b>× 2</b>, die den Betrag im Feld halbieren oder verdoppeln.","Para apagar, use o ⌫ do teclado. O campo seleciona tudo ao ser tocado, para trocar o valor de uma vez.":"Zum Löschen nutze ⌫ auf der Tastatur. Beim Antippen wird alles markiert, sodass du den Betrag direkt ersetzen kannst.","Novidades e mensagem no WhatsApp.":"Neuigkeiten und WhatsApp-Nachricht.","Mostra a despesa em <b>Novidades</b> para os amigos, com um número na aba Despesas.":"Zeigt die Ausgabe deinen Freunden unter <b>Neuigkeiten</b>, mit einer Zahl am Tab Ausgaben.","Ligue <b>Avisar o grupo</b> ao lançar. Depois, toque em WhatsApp ou Compartilhar para mandar a mensagem pronta.":"Aktiviere beim Erfassen <b>Gruppe benachrichtigen</b>. Danach schickst du das Bild per WhatsApp.","O wirteilen não manda notificação no celular com o app fechado: isso exige um servidor pago. O aviso aparece quando o amigo abre o app.":"wirteilen schickt keine Push-Mitteilungen bei geschlossener App: Dafür wäre ein kostenpflichtiger Server nötig. Der Hinweis erscheint, wenn dein Freund die App öffnet.","20 de base e as do grupo.":"20 Basiskategorien plus eigene der Gruppe.","Organiza as despesas no Resumo, cada uma com ícone e cor.":"Ordnet die Ausgaben in der Übersicht, jede mit Symbol und Farbe.","Quem criou o grupo cria categorias novas no formulário da despesa ou na engrenagem do topo, em <b>Categorias do grupo</b>.":"Wer die Gruppe erstellt hat, legt neue Kategorien im Ausgabenformular oder hinter dem Zahnrad oben unter <b>Gruppenkategorien</b> an.","Ao excluir uma categoria do grupo, as despesas dela passam a aparecer em Outros.":"Wird eine Gruppenkategorie gelöscht, erscheinen ihre Ausgaben unter Sonstiges.","Foto de perfil":"Profilfoto","Foto do iPhone ou ícone.":"iPhone-Foto oder Symbol.","Mostra a sua imagem ao lado do nome em todo o app.":"Zeigt dein Bild überall in der App neben deinem Namen.","Em Ajustes, toque na sua foto no topo. Ao escolher uma foto, arraste e faça pinça para enquadrar no círculo.":"Tipp in den Einstellungen oben auf dein Foto. Beim Auswählen ziehst und zoomst du, um es im Kreis auszurichten.","A foto é reduzida para um ícone pequeno antes de ir para a base. Só quem está nos seus grupos vê.":"Das Foto wird zu einem kleinen Symbol verkleinert, bevor es in die Datenbank geht. Nur Personen in deinen Gruppen sehen es.","Abrir o app com o rosto.":"Die App mit dem Gesicht öffnen.","Protege o app aberto neste iPhone com o Face ID (ou Touch ID).":"Schützt die geöffnete App auf diesem iPhone mit Face ID (oder Touch ID).","Ligue em Ajustes › Conta e segurança. O primeiro acesso é sempre com e-mail e senha.":"Aktivieren unter Einstellungen › Konto und Zugang. Die erste Anmeldung erfolgt immer mit E-Mail und Passwort.","O Face ID fica no aparelho: o app nunca recebe a imagem do rosto. Em outro aparelho, ligue de novo.":"Face ID bleibt auf dem Gerät: Die App erhält nie ein Bild deines Gesichts. Auf einem anderen Gerät erneut aktivieren.","Convites no WhatsApp":"Einladungen per WhatsApp","Para o grupo ou para o app.":"Für die Gruppe oder für die App.","Manda uma imagem com o visual do app: o código do grupo e os passos para entrar, ou o que o app faz e como instalar.":"Sendet ein Bild im Look der App: den Gruppencode und die Schritte zum Beitreten oder was die App macht und wie man sie installiert.","Na engrenagem do topo: <b>Enviar convite no WhatsApp</b> ou <b>Indicar o wirteilen no WhatsApp</b>.":"Hinter dem Zahnrad oben: <b>Einladung per WhatsApp senden</b> oder <b>wirteilen per WhatsApp empfehlen</b>.","A imagem vai com uma legenda só com o link, que fica clicável no WhatsApp. Quem toca no link do convite entra direto no grupo depois de criar a conta.":"Das Bild geht mit einer Bildunterschrift, die nur den Link enthält, der in WhatsApp anklickbar ist. Wer auf den Einladungslink tippt, landet nach dem Erstellen des Kontos direkt in der Gruppe.","Foto da nota ou do Pix.":"Foto der Rechnung oder des Pix.","Anexa uma foto à despesa ou ao pagamento. Na lista, aparece um clipe ao lado da data.":"Hängt ein Foto an die Ausgabe oder Zahlung. In der Liste erscheint eine Büroklammer neben dem Datum.","No formulário, toque em <b>Anexar foto do comprovante</b> e tire a foto ou escolha da galeria. Para ver, toque no clipe; toque na imagem para ampliar.":"Tipp im Formular auf <b>Belegfoto anhängen</b> und mach ein Foto oder wähle eins aus der Galerie. Zum Ansehen tipp auf die Büroklammer; tipp auf das Bild zum Vergrößern.","O app sempre compacta a foto antes de guardar (lado maior de até 1280 px, por volta de 180 KB), para não gastar o espaço gratuito da base. Só quem lançou troca ou remove o comprovante.":"Die App komprimiert das Foto immer vor dem Speichern (längste Seite bis 1280 px, etwa 180 KB), um den kostenlosen Speicher der Datenbank zu schonen. Nur wer den Beleg angehängt hat, kann ihn ändern oder entfernen.","Planilha Excel":"Excel-Tabelle","Histórico do grupo em abas.":"Verlauf der Gruppe in Blättern.","Gera um arquivo .xlsx com as abas Resumo, Despesas, Partes e Pagamentos, com cabeçalho, filtros, datas, moeda em R$ e totais.":"Erstellt eine .xlsx-Datei mit den Blättern Übersicht, Ausgaben, Anteile und Zahlungen, mit Kopfzeile, Filtern, Daten, Währung R$ und Summen.","Na aba Backup, toque em <b>Excel (.xlsx)</b>. No iPhone, salve em Arquivos ou abra no Excel.":"Tipp im Tab Backup auf <b>Excel (.xlsx)</b>. Auf dem iPhone in Dateien speichern oder in Excel öffnen.","A aba Partes tem uma linha por pessoa em cada despesa: é a melhor para montar tabela dinâmica por pessoa, mês ou categoria.":"Das Blatt Anteile hat eine Zeile pro Person je Ausgabe: am besten für eine Pivot-Tabelle nach Person, Monat oder Kategorie.","Despesa, convite e Pix como imagem.":"Ausgabe, Einladung und Pix als Bild.","Monta uma imagem com o visual do app: a despesa com a divisão, o convite com o código ou a cobrança Pix com o QR Code.":"Erstellt ein Bild im Look der App: die Ausgabe mit Aufteilung, die Einladung mit Code oder die Pix-Anfrage mit QR-Code.","Toque em <b>Enviar no WhatsApp</b>, escolha WhatsApp na lista do iPhone e a conversa.":"Tipp auf <b>Per WhatsApp senden</b>, wähle WhatsApp in der Liste des iPhones und den Chat.","A imagem não leva texto junto: na legenda vai só o link do app ou do convite (clicável no WhatsApp). Na cobrança Pix, a legenda é o Pix copia e cola, para copiar com um toque.":"Das Bild geht ohne Text: Die Bildunterschrift enthält nur den Link zur App oder Einladung (in WhatsApp anklickbar). Bei der Pix-Anfrage ist es der Pix-Copy-&-Paste-Code, zum Kopieren mit einem Tipp.","Trocar e-mail ou senha":"E-Mail oder Passwort ändern","Ajustes › Conta e acesso.":"Einstellungen › Konto und Zugang.","Troca o e-mail de entrada ou a senha da conta.":"Ändert die Anmelde-E-Mail oder das Passwort des Kontos.","Toque em <b>Trocar</b> na linha do e-mail ou da senha. O app pede a senha atual para confirmar que é você.":"Tipp in der Zeile E-Mail oder Passwort auf <b>Ändern</b>. Die App fragt das aktuelle Passwort ab, um zu bestätigen, dass du es bist.","O e-mail novo só vale depois que você tocar no link que chega nele.":"Die neue E-Mail gilt erst, nachdem du auf den Link darin getippt hast.","Excluir a conta":"Konto löschen","Ajustes › Conta e segurança.":"Einstellungen › Konto und Zugang.","Apaga o seu login, o perfil, a chave Pix e a foto.":"Löscht dein Login, Profil, Pix-Schlüssel und Foto.","Toque em <b>Excluir minha conta</b>, confirme a senha e marque a confirmação.":"Tipp auf <b>Mein Konto löschen</b>, bestätige das Passwort und setz den Haken.","Nos grupos de outras pessoas, você sai e suas despesas ficam como ex-membro. Nos que você criou, o grupo passa para outro membro; se só você estiver nele, é excluído. Faça os acertos antes.":"In Gruppen anderer verlässt du die Gruppe, deine Ausgaben bleiben als ehemaliges Mitglied. In deinen eigenen Gruppen geht die Gruppe an ein anderes Mitglied; bist du allein darin, wird sie gelöscht. Vorher ausgleichen.","Só quem criou o grupo.":"Nur wer die Gruppe erstellt hat.","Tira a pessoa do grupo. Ela continua no histórico como ex-membro.":"Nimmt die Person aus der Gruppe. Sie bleibt im Verlauf als ehemaliges Mitglied.","Engrenagem do topo › <b>Remover</b> ao lado do nome, e toque de novo para confirmar.":"Zahnrad oben › <b>Entfernen</b> neben dem Namen, und zum Bestätigen erneut tippen.","O app avisa se a pessoa ainda tem saldo. Acerte antes de remover.":"Die App warnt, wenn die Person noch einen Saldo hat. Vor dem Entfernen ausgleichen.","A versão aparece na tela de entrada e no fim de Ajustes.":"Die Version steht auf dem Anmeldebildschirm und am Ende der Einstellungen.","Ao relatar um problema, diga a versão.":"Gib bei einem Problem die Version an.","Modos de divisão":"Aufteilungsarten","Igual, Valores e Partes.":"Gleich, Beträge und Anteile.","Define quanto da despesa cabe a cada pessoa.":"Legt fest, wie viel der Ausgabe auf jede Person entfällt.","<b>Igual</b> divide entre os marcados. <b>Valores</b> recebe o valor exato de cada um. <b>Partes</b> divide por peso (2 partes pagam o dobro de 1).":"<b>Gleich</b> teilt unter den Markierten. <b>Beträge</b> nimmt den genauen Betrag jeder Person. <b>Anteile</b> teilt nach Gewicht (2 Anteile zahlen das Doppelte von 1).","Os centavos que sobram de uma divisão vão para as primeiras pessoas da lista, para a soma fechar com o total.":"Übrige Cent einer Aufteilung gehen an die ersten Personen der Liste, damit die Summe stimmt.","Quem paga quem para zerar o grupo.":"Wer wem zahlt, um die Gruppe auszugleichen.","Calcula o menor número de transferências que zera todos os saldos.":"Berechnet die wenigsten Überweisungen, die alle Salden ausgleichen.","Cada linha tem o botão de Pix de quem recebe e o botão de registrar o pagamento.":"Jede Zeile hat die Pix-Taste des Empfängers und die Taste zum Erfassen der Zahlung.","Os acertos mudam a cada despesa lançada. Registre os pagamentos logo após o Pix para a lista ficar certa para todos.":"Die Ausgleiche ändern sich mit jeder neuen Ausgabe. Erfasse Zahlungen direkt nach dem Pix, damit die Liste für alle stimmt.","Pix copia e cola":"Pix Copy & Paste","Código com chave, nome e valor.":"Code mit Schlüssel, Name und Betrag.","Monta o código Pix no padrão do Banco Central (BR Code) com o valor do acerto.":"Erstellt den Pix-Code im Standard der Banco Central (BR Code) mit dem Ausgleichsbetrag.","Copie o código e cole em <b>Pix › Pix copia e cola</b> no app do banco. O QR Code serve para outra pessoa escanear.":"Kopiere den Code und füge ihn in der Banking-App unter <b>Pix › Pix Copy & Paste</b> ein. Der QR-Code ist zum Scannen durch eine andere Person.","O nome e a cidade vêm do perfil de quem recebe. Se o banco recusar, confira a chave em Ajustes.":"Name und Stadt kommen aus dem Profil des Empfängers. Lehnt die Bank ab, prüf den Schlüssel in den Einstellungen.","Indicador de sincronização":"Synchronisierungsanzeige","O texto ao lado do nome do grupo.":"Der Text neben dem Gruppennamen.","Mostra se o que você lançou já chegou à base online.":"Zeigt, ob deine Einträge die Online-Datenbank erreicht haben.","<b>Sincronizado</b>: todos já veem. <b>Enviando…</b>: subindo agora. <b>Offline</b>: salvo no aparelho, sobe quando a internet voltar.":"<b>Synchronisiert</b>: Alle sehen es. <b>Wird gesendet…</b>: wird gerade hochgeladen. <b>Offline</b>: auf dem Gerät gespeichert, lädt hoch, sobald Internet da ist.","Se ficar parado em Enviando, use <b>Forçar sincronização</b> em Ajustes.":"Wenn es bei Wird gesendet hängt, nutze <b>Synchronisierung erzwingen</b> in den Einstellungen.","Sem internet":"Kein Internet","O que funciona e o que não funciona offline.":"Was offline funktioniert und was nicht.","O app abre, mostra os dados e aceita lançamentos sem conexão.":"Die App öffnet sich, zeigt die Daten und nimmt Einträge ohne Verbindung an.","Lance normalmente. Os dados ficam guardados no aparelho e sobem sozinhos.":"Erfasse ganz normal. Die Daten bleiben auf dem Gerät und werden automatisch hochgeladen.","Precisam de internet: entrar em grupo por código, restaurar backup, criar conta e recuperar senha.":"Internet brauchen: einer Gruppe per Code beitreten, Backup wiederherstellen, Konto erstellen und Passwort wiederherstellen.","Totais por período, categoria e pessoa.":"Summen nach Zeitraum, Kategorie und Person.","Mostra o total gasto, a sua parte, quanto você pagou e a divisão por categoria.":"Zeigt die Gesamtausgaben, deinen Anteil, wie viel du bezahlt hast und die Aufteilung nach Kategorie.","Escolha o mês em <b>Período</b>. A tabela Por pessoa compara o que cada um pagou e consumiu.":"Wähle den Monat unter <b>Zeitraum</b>. Die Tabelle Nach Person vergleicht, was jede Person bezahlt und verbraucht hat.","A diferença do Resumo não conta os pagamentos de acerto. Para saber quem deve, use a aba Saldos.":"Die Differenz in der Übersicht zählt keine Ausgleichszahlungen. Wer schuldet, siehst du im Tab Salden.","Editar e excluir":"Bearbeiten und löschen","Só quem lançou corrige.":"Nur wer erfasst hat, korrigiert.","Só quem lançou a despesa (ou registrou o pagamento) pode alterar ou excluir. Os outros veem os detalhes com um cadeado.":"Nur wer die Ausgabe erfasst (oder die Zahlung gebucht) hat, kann sie ändern oder löschen. Andere sehen die Details mit einem Schloss.","Toque no item na lista. Para excluir, toque em Excluir e depois toque de novo para confirmar.":"Tipp auf den Eintrag in der Liste. Zum Löschen tipp auf Löschen und zum Bestätigen erneut.","A despesa mostra quem lançou e quando foi alterada. Exportar o backup antes de grandes correções é uma boa garantia.":"Die Ausgabe zeigt, wer sie erfasst hat und wann sie geändert wurde. Vor großen Korrekturen ist ein exportiertes Backup eine gute Absicherung.","Privacidade e segurança":"Datenschutz und Sicherheit","Quem vê o quê.":"Wer was sieht.","Só quem está no grupo lê as despesas, os saldos e as chaves Pix daquele grupo.":"Nur Personen in der Gruppe sehen deren Ausgaben, Salden und Pix-Schlüssel.","Para alguém entrar, é preciso ter conta e o código de convite.":"Zum Beitreten braucht man ein Konto und den Einladungscode.","As regras de acesso ficam na base de dados, não no app. Mesmo alguém com o endereço do site não lê nada sem estar no grupo.":"Die Zugriffsregeln liegen in der Datenbank, nicht in der App. Selbst wer die Adresse der Seite kennt, liest nichts ohne Mitgliedschaft in der Gruppe.","Tela de entrada. O link <b>Esqueceu a senha?</b> fica logo abaixo do botão Entrar.":"Anmeldebildschirm. Der Link <b>Passwort vergessen?</b> steht direkt unter der Taste Anmelden.","Tela de entrada, com a opção <b>Criar conta</b> selecionada.":"Anmeldebildschirm mit ausgewählter Option <b>Konto erstellen</b>.","Grupo · 4 pessoas":"Gruppe · 4 Personen","<b>Viagem Ilhabela</b>":"<b>Reise nach Ilhabela</b>","<i></i>Sincronizado":"<i></i>Synchronisiert","Topo do app. Tocar no <b>nome do grupo</b> abre a lista dos seus grupos, com as opções de criar e de entrar com código.":"Oben in der App. Ein Tipp auf den <b>Gruppennamen</b> öffnet deine Gruppen, mit den Optionen Erstellen und Mit Code beitreten.","Bloco <b>Meu perfil e Pix</b>, o primeiro da aba Ajustes.":"Der Bereich <b>Mein Profil und Pix</b>, der erste im Tab Einstellungen.","Copiar convite":"Einladung kopieren","Tela do grupo, aberta pela engrenagem do topo. Cada grupo tem o próprio código.":"Bildschirm der Gruppe, geöffnet über das Zahnrad oben. Jede Gruppe hat einen eigenen Code.","Adicionar à Tela de Início":"Zum Home-Bildschirm","Barra do Safari no iPhone. O botão <b>Compartilhar</b> é o quadrado com a seta para cima.":"Safari-Leiste auf dem iPhone. Die Taste <b>Teilen</b> ist das Quadrat mit dem Pfeil nach oben.","O botão + fica no topo, à direita do nome do grupo, nas abas Despesas e Saldos.":"Die Taste + ist oben rechts neben dem Gruppennamen, in den Tabs Ausgaben und Salden.","5 partes · R$ 112,00 por parte":"5 Anteile · R$ 112,00 pro Anteil","Modo <b>Partes</b>: Caio levou acompanhante e conta 2 partes. A linha de baixo confirma a divisão.":"Modus <b>Anteile</b>: Caio hat eine Begleitung mitgebracht und zählt 2 Anteile. Die Zeile darunter bestätigt die Aufteilung.","<b>Você</b> paga <b>Caio</b>":"<b>Du</b> zahlst <b>Caio</b>","Uma linha de <b>Acertos sugeridos</b>. Quando quem recebe é você, o botão vira <b>Mostrar meu Pix</b>.":"Eine Zeile der <b>Vorgeschlagenen Ausgleiche</b>. Wenn du der Empfänger bist, wird die Taste zu <b>Meinen Pix zeigen</b>.","Pix copia e cola · valor incluso":"Pix Copy & Paste · Betrag enthalten","Tela de Pix. O QR Code serve para outra pessoa escanear; no mesmo celular, use o botão de copiar.":"Pix-Bildschirm. Der QR-Code ist zum Scannen durch eine andere Person; auf demselben Handy nutze die Taste Kopieren.","<b>Mesclar</b>":"<b>Zusammenführen</b>","Mantém o que já está no grupo e repõe o backup.":"Behält, was schon in der Gruppe ist, und stellt das Backup wieder her.","<b>Substituir tudo</b>":"<b>Alles ersetzen</b>","Deixa o grupo igual ao backup.":"Macht die Gruppe identisch mit dem Backup.","Fim da tela <b>Restaurar backup</b>. Substituir tudo só aparece para quem criou o grupo.":"Ende des Bildschirms <b>Backup wiederherstellen</b>. Alles ersetzen erscheint nur für die Person, die die Gruppe erstellt hat.","<i></i>Enviando…":"<i></i>Wird gesendet…","<i></i>Offline · salvo aqui":"<i></i>Offline · hier gespeichert","<i></i>Neste aparelho (demonstração)":"<i></i>Auf diesem Gerät (Demo)","Anterior":"Zurück",">Próxima":">Weiter","Ver por etapa":"Schritt für Schritt ansehen","Ver tudo de uma vez":"Alles auf einmal ansehen","etapas":"Schritte","Etapa":"Schritt","Começar":"Starten","O que faz":"Was es macht","Como usar":"So geht's","Detalhes":"Details","resultado":"Ergebnis","resultados":"Ergebnisse","para “":"für „","Nada encontrado para “":"Nichts gefunden für „","”. Tente outra palavra, como Pix, backup ou senha.":"“. Versuch ein anderes Wort, etwa Pix, Backup oder Passwort.","Tour guiado · v":"Geführte Tour · v","Conheça o wirteilen tela por tela":"Lerne wirteilen Bildschirm für Bildschirm kennen","O tour destaca cada recurso e explica para que serve. Feche quando quiser no ×, em Pular ou na tecla Esc.":"Die Tour hebt jede Funktion hervor und erklärt, wofür sie da ist. Schließe sie jederzeit mit ×, Überspringen oder der Esc-Taste.","Fazer o tour completo":"Ganze Tour machen" nto mit dieser E-Mail gibt, wurde der Link gesendet.","Criando…":"Wird erstellt…","Escreva uma descrição.":"Schreib eine Beschreibung.","Informe um valor maior que zero.":"Gib einen Betrag größer als null ein.","Informe a data.":"Gib das Datum ein.","Espere a imagem terminar de compactar.":"Warte, bis das Bild fertig komprimiert ist.","Despesa atualizada":"Ausgabe aktualisiert","lançamentos criados":"Einträge erstellt","Despesa lançada":"Ausgabe erfasst","Quem pagou e quem recebeu precisam ser pessoas diferentes.":"Zahlende und empfangende Person müssen verschieden sein.","Só quem registrou pode editar.":"Nur wer gebucht hat, kann bearbeiten.","Pagamento atualizado":"Zahlung aktualisiert","Pagamento registrado":"Zahlung erfasst","Você está em dia com o grupo.":"Du bist mit der Gruppe ausgeglichen.","Escreva seu nome.":"Schreib deinen Namen.","Essa chave não parece ser do tipo":"Dieser Schlüssel passt nicht zur Art","Perfil salvo":"Profil gespeichert","Digite um e-mail válido.":"Gib eine gültige E-Mail ein.","Esse já é o seu e-mail.":"Das ist bereits deine E-Mail.","Digite a sua senha atual.":"Gib dein aktuelles Passwort ein.","Enviamos um link para":"Wir haben einen Link gesendet an","E-mail trocado":"E-Mail geändert","Digite a senha atual.":"Gib das aktuelle Passwort ein.","A senha nova precisa ter pelo menos 6 caracteres.":"Das neue Passwort muss mindestens 6 Zeichen haben.","As duas senhas novas não são iguais.":"Die beiden neuen Passwörter stimmen nicht überein.","Salvando…":"Wird gespeichert…","Senha trocada.":"Passwort geändert.","Digite a sua senha para confirmar.":"Gib zur Bestätigung dein Passwort ein.","Marque a confirmação para excluir a conta.":"Setz den Haken zur Bestätigung, um das Konto zu löschen.","Excluindo a conta…":"Konto wird gelöscht…","Conta excluída. Obrigado por usar o wirteilen.":"Konto gelöscht. Danke, dass du wirteilen genutzt hast.","O grupo precisa de um nome.":"Die Gruppe braucht einen Namen.","Nome do grupo salvo":"Gruppenname gespeichert","Digite uma taxa maior que zero.":"Gib einen Kurs größer als null ein.","Taxa salva.":"Kurs gespeichert.","Face ID ativado. Na próxima abertura o app pede o seu rosto.":"Face ID aktiviert. Beim nächsten Öffnen fragt die App nach deinem Gesicht.","Face ID cancelado.":"Face ID abgebrochen.","Este aparelho não liberou o Face ID para o app.":"Dieses Gerät hat Face ID für die App nicht freigegeben.","Face ID desativado":"Face ID deaktiviert","Arquivo":"Datei","Não foi possível conectar ao Firebase. Verifique a internet e o arquivo firebase-config.js.":"Keine Verbindung zu Firebase. Prüf das Internet und die Datei firebase-config.js.","Valor (":"Betrag (","Grupo criado. Convide os amigos pela engrenagem no topo.":"Gruppe erstellt. Lade deine Freunde über das Zahnrad oben ein.","6 ou mais caracteres":"6 oder mehr Zeichen","Português, inglês ou alemão.":"Portugiesisch, Englisch oder Deutsch.","Troca todo o app de idioma: telas, manual, categorias, planilha e imagens enviadas no WhatsApp.":"Stellt die ganze App auf eine andere Sprache um: Bildschirme, Handbuch, Kategorien, Tabelle und die per WhatsApp gesendeten Bilder.","Toque na <b>bandeira</b> na tela de entrada ou no topo da aba Despesas e escolha o idioma. A bandeira mostra sempre o idioma em uso.":"Tippen Sie auf die <b>Flagge</b> auf dem Anmeldebildschirm oder oben im Tab Ausgaben und wählen Sie die Sprache. Die Flagge zeigt immer die aktive Sprache.","A escolha fica guardada neste aparelho; cada pessoa usa o seu idioma no mesmo grupo. As categorias criadas recebem uma sugestão de tradução, e quem criou o grupo pode corrigir os nomes na engrenagem, em Categorias.":"Die Auswahl wird auf diesem Gerät gespeichert; jede Person kann in derselben Gruppe ihre eigene Sprache nutzen. Eigene Kategorien erhalten einen Übersetzungsvorschlag, und wer die Gruppe erstellt hat, kann die Namen über das Zahnrad unter Kategorien korrigieren.","Ver os valores em outra moeda.":"Beträge in einer anderen Währung sehen.","Mostra e deixa digitar os valores em dólar, euro, libra e outras moedas, convertendo pelo câmbio do dia.":"Zeigt Beträge in Dollar, Euro, Pfund und anderen Währungen an und lässt sie so eingeben, umgerechnet zum Tageskurs.","Em <b>Ajustes › Moeda e câmbio</b>, escolha a moeda e toque em <b>Atualizar com o câmbio do dia</b>. Se não houver conexão com o Banco Central, digite a taxa à mão.":"Wählen Sie unter <b>Einstellungen › Währung und Wechselkurs</b> die Währung und tippen Sie auf <b>Mit dem heutigen Kurs aktualisieren</b>. Ist die Banco Central nicht erreichbar, geben Sie den Kurs selbst ein.","A taxa é a PTAX de venda do Banco Central do Brasil (último fechamento). Os valores continuam guardados em reais, então o grupo não muda para os outros. O Pix é sempre em reais.":"Der Kurs ist der PTAX-Verkaufskurs der Banco Central do Brasil (letzter Schlusskurs). Die Beträge bleiben in Reais gespeichert, für die anderen in der Gruppe ändert sich nichts. Pix ist immer in Reais.","Buscar e filtrar":"Suchen und filtern","Achar uma despesa ou categoria.":"Eine Ausgabe oder Kategorie finden.","Na aba Despesas, busca pelo nome e filtra por categoria, pessoa e tipo, com ordem por data, valor ou nome. No lançamento, a busca acha a categoria pelo nome.":"Im Tab Ausgaben wird nach Namen gesucht und nach Kategorie, Person und Art gefiltert, sortiert nach Datum, Betrag oder Name. Beim Erfassen findet die Suche die Kategorie über den Namen.","Digite no campo <b>Buscar</b> ou toque em <b>Filtros</b>. O <b>x</b> à direita do campo apaga a busca; <b>Limpar filtros</b> desfaz toda busca, filtro e ordem de uma vez.":"Tippen Sie in das Feld <b>Suchen</b> oder auf <b>Filter</b>. Das <b>x</b> rechts im Feld löscht die Suche; <b>Filter löschen</b> hebt Suche, Filter und Sortierung auf einmal auf.","A busca ignora acentos e maiúsculas e só atualiza a lista quando você para de digitar, para não travar. O total filtrado aparece acima da lista.":"Die Suche ignoriert Akzente sowie Groß- und Kleinschreibung und aktualisiert die Liste erst, wenn Sie aufhören zu tippen, damit nichts hakt. Die gefilterte Summe steht über der Liste.","Concluir o grupo":"Gruppe abschließen","Fechar uma viagem ou evento.":"Eine Reise oder ein Event abschließen.","Deixa o grupo só para consulta, com o resumo final de quem pagou, quem consumiu e os acertos.":"Macht die Gruppe schreibgeschützt, mit der Schlussübersicht, wer bezahlt hat, wer was verbraucht hat und den Ausgleichszahlungen.","Quem criou o grupo toca na <b>engrenagem</b> do topo e em <b>Concluir grupo</b>. Para voltar a lançar, usa <b>Reabrir grupo</b> no mesmo lugar.":"Wer die Gruppe erstellt hat, tippt oben auf das <b>Zahnrad</b> und dann auf <b>Gruppe abschließen</b>. Um wieder zu erfassen, dort <b>Gruppe wieder öffnen</b> wählen.","Todos continuam vendo o grupo e o resumo ao selecioná-lo, e seguem usando os outros grupos normalmente. Ninguém lança, edita ou registra pagamento enquanto ele estiver concluído.":"Alle sehen die Gruppe und ihre Übersicht weiterhin, wenn sie sie auswählen, und nutzen ihre anderen Gruppen wie gewohnt. Solange sie abgeschlossen ist, erfasst, bearbeitet oder bucht niemand etwas.","Em reais":"In Reais","Moeda":"Währung","Valor na moeda":"Betrag in Währung","Câmbio":"Wechselkurs","Valores em reais. Despesas em outra moeda mostram também a moeda, o valor original e o câmbio usado. As colunas \"Parte\" mostram quanto cada pessoa consumiu em cada despesa. Use os filtros do cabeçalho.":"Beträge in Reais. Ausgaben in einer anderen Währung zeigen zusätzlich Währung, Originalbetrag und verwendeten Kurs. Die Spalten „Anteil“ zeigen, wie viel jede Person bei jeder Ausgabe verbraucht hat. Nutzen Sie die Filter in der Kopfzeile.","Moeda da despesa":"Währung der Ausgabe","Câmbio: quantos reais vale 1 unidade da moeda":"Wechselkurs: wie viele Reais 1 Einheit der Währung wert ist","Câmbio do dia":"Tageskurs","Taxa digitada à mão":"Kurs von Hand eingegeben","PTAX de venda do Banco Central de":"PTAX-Verkaufskurs der Banco Central vom","Informe o câmbio ou toque em Câmbio do dia.":"Kurs eingeben oder auf Tageskurs tippen.",". Cada um entra no mês em que vence.":". Jede Buchung zählt in dem Monat, in dem sie fällig ist.","Informe o câmbio da moeda.":"Geben Sie den Wechselkurs ein.","manual":"manuell","Lançar em dólar, euro e outras.":"Ausgaben in Dollar, Euro und mehr erfassen.","Lança a despesa na moeda em que ela foi paga e converte para reais pelo câmbio do dia, para os saldos e o Pix.":"Erfasst die Ausgabe in der Währung, in der sie bezahlt wurde, und rechnet sie für Salden und Pix zum Tageskurs in Reais um.","Em <b>Nova despesa</b>, escolha a moeda ao lado do valor (BRL é o padrão). O app busca o câmbio do dia; toque em <b>Câmbio do dia</b> para atualizar ou digite a taxa.":"Wählen Sie unter <b>Neue Ausgabe</b> die Währung neben dem Betrag (Standard ist BRL). Die App holt den Tageskurs; tippen Sie auf <b>Tageskurs</b>, um ihn zu aktualisieren, oder geben Sie den Kurs selbst ein.","A taxa é a PTAX de venda do Banco Central do Brasil (último fechamento). A despesa guarda o valor na moeda, o câmbio usado e o valor em reais; saldos, resumo e Pix ficam sempre em reais. O app lembra a última moeda usada em cada grupo.":"Der Kurs ist der PTAX-Verkaufskurs der Banco Central do Brasil (letzter Schlusskurs). Die Ausgabe speichert den Betrag in ihrer Währung, den verwendeten Kurs und den Betrag in Reais; Salden, Übersicht und Pix sind immer in Reais. Die App merkt sich die zuletzt verwendete Währung jeder Gruppe.","A 1.1 leva a escolha da moeda para a própria despesa e troca o idioma na hora, sem reiniciar. A 1.0 traz inglês e alemão, moeda com o câmbio do Banco Central, filtros, busca de categoria e concluir grupo. A 0.9 permite anexar comprovante como foto, sempre compactada. A 0.8 deixa os envios só pelo WhatsApp, como imagem com o link na legenda. A 0.7 deixa o selo de em dia verde e troca a planilha .csv por um Excel formatado. A 0.6 leva o grupo para a engrenagem do topo, cria a aba Backup, deixa Ajustes só com a sua conta e manda despesas, convites e Pix como imagem. A 0.5 traz a tela de entrada nova, com o logo animado. A 0.4 permite enquadrar a foto de perfil com zoom e arrastando. A 0.3 deixa só quem lançou editar ou excluir, permite excluir a própria conta e deixa mais claro como remover alguém do grupo. A 0.2 organiza categorias, ícones e cores em grade, sem nada rolar para o lado, e faz o iPhone pegar as atualizações na hora. A 0.1 trouxe cores por aba, foto de perfil, Face ID, parcelas, categorias do grupo, convites por e-mail, exclusão do grupo com histórico e o tour guiado.":"Version 1.1 verlegt die Währungswahl direkt in die Ausgabe und wechselt die Sprache sofort, ohne Neustart. 1.0 bringt Englisch und Deutsch, Währungen mit dem Kurs der Banco Central, Filter, Kategoriensuche und das Abschließen von Gruppen. 0.9 erlaubt Belege als komprimierte Fotos. 0.8 sendet nur per WhatsApp, als Bild mit dem Link in der Bildunterschrift. 0.7 macht das Abzeichen grün und ersetzt die .csv durch ein formatiertes Excel. 0.6 legt die Gruppe hinter das Zahnrad oben, schafft den Tab Backup, lässt in den Einstellungen nur dein Konto und sendet Ausgaben, Einladungen und Pix als Bilder. 0.5 bringt den neuen Anmeldebildschirm mit animiertem Logo. 0.4 erlaubt, das Profilfoto mit Zoom und Ziehen auszurichten. 0.3 lässt nur die erfassende Person bearbeiten oder löschen, erlaubt das Löschen des eigenen Kontos und macht das Entfernen von Personen klarer. 0.2 ordnet Kategorien, Symbole und Farben im Raster ohne seitliches Scrollen und lässt das iPhone Updates sofort laden. 0.1 brachte Farben pro Tab, Profilfoto, Face ID, Raten, Gruppenkategorien, E-Mail-Einladungen, das Löschen von Gruppen mit Verlauf und die geführte Tour.","<b>Positivo</b> é o que os amigos te devem (você pagou mais do que consumiu). <b>Negativo</b> é o que você deve. Quem não deve nada ganha a medalha 🥇 de <b>em dia</b>.":"<b>Positiv</b> ist, was deine Freunde dir schulden (du hast mehr bezahlt als verbraucht). <b>Negativ</b> ist, was du schuldest. Wer nichts schuldet, bekommt die Medaille 🥇 <b>ausgeglichen</b>.","Barra verde à direita: tem a receber. Barra vermelha à esquerda: tem a pagar. Quem não deve nada aparece com a <b>medalha 🥇</b>.":"Grüner Balken rechts: bekommt Geld. Roter Balken links: muss zahlen. Wer nichts schuldet, hat die <b>Medaille 🥇</b>.","Medalha de em dia":"Medaille ausgeglichen","A medalha 🥇 ao lado do nome.":"Die Medaille 🥇 neben dem Namen.","Vale para o grupo aberto. Em outro grupo, a mesma pessoa pode estar sem medalha.":"Gilt für die geöffnete Gruppe. In einer anderen Gruppe kann dieselbe Person ohne Medaille sein.","A 1.2 troca o selo de verificado pela medalha 🥇 para quem está em dia. A 1.1 leva a escolha da moeda para a própria despesa e troca o idioma na hora, sem reiniciar. A 1.0 traz inglês e alemão, moeda com o câmbio do Banco Central, filtros, busca de categoria e concluir grupo. A 0.9 permite anexar comprovante como foto, sempre compactada. A 0.8 deixa os envios só pelo WhatsApp, como imagem com o link na legenda. A 0.7 deixa o selo de em dia verde e troca a planilha .csv por um Excel formatado. A 0.6 leva o grupo para a engrenagem do topo, cria a aba Backup, deixa Ajustes só com a sua conta e manda despesas, convites e Pix como imagem. A 0.5 traz a tela de entrada nova, com o logo animado. A 0.4 permite enquadrar a foto de perfil com zoom e arrastando. A 0.3 deixa só quem lançou editar ou excluir, permite excluir a própria conta e deixa mais claro como remover alguém do grupo. A 0.2 organiza categorias, ícones e cores em grade, sem nada rolar para o lado, e faz o iPhone pegar as atualizações na hora. A 0.1 trouxe cores por aba, foto de perfil, Face ID, parcelas, categorias do grupo, convites por e-mail, exclusão do grupo com histórico e o tour guiado.":"Version 1.2 ersetzt das Verifiziert-Abzeichen durch die Medaille 🥇 für alle, die ausgeglichen sind. Version 1.1 verlegt die Währungswahl direkt in die Ausgabe und wechsel
