.tm-cur-a{display:flex;gap:6px;flex:none}
.tm-cur-a .btn{min-height:36px;padding:0 11px;font-size:13px;gap:4px}
.tm-cur-a .btn .ic{width:15px;height:15px}
.tm-cardw{position:relative;min-width:0}
.tm-cardw .tm-card{width:100%;gap:8px;padding-right:36px}
.tm-cardw .tm-dots i{width:14px;height:14px;margin-left:-6px}
.tm-cardw .tm-dots i:first-child{margin-left:0}
.tm-card-n{display:grid;min-width:0}
.tm-card-n small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-card-ed{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--fill);color:var(--muted)}
.tm-card-ed .ic{width:15px;height:15px}
.tm-name-prev{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--paper)}
.tm-name-prev span{display:grid;min-width:0;font-size:13.5px;color:var(--muted)}
.tm-name-prev b{color:var(--ink);font-size:15px}
.tm-sync{display:flex;align-items:center;gap:7px;margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.tm-sync .ic{flex:none;width:15px;height:15px}
.tm-sync.ok{color:var(--pos)}
.tm-sync.wait .ic{animation:spin 1.2s linear infinite}
.tm-sync.bad{color:var(--neg)}
.tm-sync .link{font-size:12.5px}
.tm-open{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--bg);text-align:left;color:var(--ink)}
.tm-open span{flex:1;min-width:0;display:grid;gap:2px}
.tm-open small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-open>.ic{width:16px;height:16px;color:var(--ink-3)}
.tm-dots{display:inline-flex;flex:none}
.tm-dots i{width:16px;height:16px;border-radius:50%;margin-left:-5px;box-shadow:0 0 0 2px var(--paper)}
.tm-dots i:first-child{margin-left:0}
.tm-prev{display:grid;gap:10px;margin:2px 0 6px;padding:12px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.tm-prev .hero{padding:14px}
.tm-prev .big{font-size:28px}
.tm-prev-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--paper)}
.tm-prev-btn{margin-left:auto;padding:8px 14px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600}
.tm-prev-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:8px 4px;border-radius:14px;background:var(--paper)}
.tm-prev-tabs span{display:grid;justify-items:center;gap:2px;min-width:0}
.tm-prev-tabs svg{width:22px;height:22px}
.tm-prev-tabs .ic-o,.tm-row-ic .ic-o{display:none}
.tm-prev-tabs small{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tm-card{display:flex;align-items:center;gap:10px;min-width:0;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);text-align:left}
.tm-card b{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-card.on{border-color:var(--c,var(--accent));box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.tm-rand .ic{width:20px;height:20px;color:var(--c,var(--accent))}
.tm-list{display:grid;gap:0;border-radius:14px;background:var(--paper);overflow:hidden}
.tm-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 12px;border-bottom:1px solid var(--sep)}
.tm-row:last-child{border-bottom:0}
.tm-row-ic svg{width:24px;height:24px;display:block}
.tm-row-n{flex:1;min-width:0;display:grid;font-weight:600;font-size:15px}
.tm-row-n small{font-weight:500;font-size:11.5px;color:var(--muted)}
input[type=color]{flex:none;width:38px;height:38px;min-height:0;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.tm-sws{display:flex;flex-wrap:wrap;gap:10px}
.tm-sw{position:relative;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.tm-sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--sw)}
.tm-sw-pick{display:grid;place-items:center;background:conic-gradient(from 0deg,#E5484D,#F5A524,#46A758,#0091FF,#8E4EC6,#E5484D)}
.tm-sw-pick.on{background:var(--sw)}
.tm-sw-pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;box-shadow:none}
.tm-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tm-opt{display:grid;justify-items:center;gap:6px;min-width:0;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500}
.tm-opt span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-opt.on{border-color:var(--c,var(--accent));box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--accent)) 35%,transparent);font-weight:600}
.tm-fp{display:grid;place-items:center;width:46px;height:30px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.tm-fp i{width:28px;height:14px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tm-hp{width:52px;height:30px;border-radius:8px}
.tm-aa{font-size:22px;font-weight:700;line-height:30px;height:30px}
.tm-cn{width:40px;height:30px;border:2px solid var(--c,var(--accent));border-right:0;border-bottom:0;border-top-right-radius:0!important;border-bottom-left-radius:0!important;border-bottom-right-radius:0!important}
.tm-opt .tm-dots i{width:13px;height:13px;margin-left:-4px}
.tm-opt .tm-dots{height:30px;align-items:center}

/* ── v1.1: moeda na despesa ── */
.money-in{display:flex;min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.money-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.money-in select{flex:none;width:auto;min-width:0;border:0;border-right:1px solid var(--line);border-radius:var(--r) 0 0 var(--r);padding:10px 22px 10px 10px;background-position:right 7px center;font-weight:600;font-size:14px;background-color:transparent;box-shadow:none}
.money-in input{flex:1;min-width:0;border:0;border-radius:0 var(--r) var(--r) 0;background:transparent;box-shadow:none!important}
.fx-line{margin:-4px 0 14px;padding:10px 12px;border-radius:14px;background:var(--fill)}
.fx-row{display:flex;align-items:center;gap:8px;min-width:0}
.fx-k{flex:none;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.fx-in{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.fx-in span{font-size:14px;color:var(--muted)}
.fx-in input{min-height:38px;padding:7px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.fx-up{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 11px;border:0;border-radius:11px;background:var(--paper);color:var(--accent);font-size:13px;font-weight:600}
.fx-up .ic{width:16px;height:16px}
.fx-up.spin .ic{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx-line small{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
.fx-line small b{color:var(--ink);font-weight:600}
.row-v .fxv{display:block;font-size:11.5px;color:var(--muted);font-weight:500}

/* ── v1.0: busca e filtros ── */
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch>.ic{position:absolute;left:12px;width:18px;height:18px;color:var(--ink-3);pointer-events:none;stroke-width:2}
.srch input{width:100%;min-height:44px;padding:10px 42px 10px 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button{display:none}
.srch .clr{position:absolute;right:6px;width:32px;height:32px;border:0;border-radius:50%;background:var(--fill);color:var(--ink-2,var(--ink));display:grid;place-items:center;padding:0}
.srch .clr .ic{width:15px;height:15px;stroke-width:2.4}
.srch input:placeholder-shown~.clr{display:none}
.man-head .srch{margin-top:12px}
.fbar{display:flex;gap:8px;align-items:center;margin:14px 0 8px}
.fbar .srch{flex:1}
.fbtn{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);font-size:15px;font-weight:500}
.fbtn .ic{width:18px;height:18px}
.fbtn.on{border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.fbtn .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c,var(--accent));color:var(--on-c);font-size:11px;font-weight:700;display:grid;place-items:center}
.fpanel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 10px;padding:12px;border-radius:16px;background:var(--paper)}
.fpanel .fld{margin:0}
.fsum{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px;font-size:13.5px;color:var(--muted)}
.fclear{border:0;background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);color:var(--c,var(--accent));font-weight:600;font-size:13.5px;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:5px}
.fclear .ic{width:14px;height:14px;stroke-width:2.4}
.cat-srch{margin:0 0 10px}
.cat.nohit{display:none}
.cat-none{grid-column:1/-1;margin:4px 0;color:var(--muted);font-size:14px}

/* ── v1.0: grupo concluído ── */
.frame.concl #fab,.frame.concl [data-a="pay-new"],.frame.concl [data-a="new-exp"],.frame.concl #sec-restaurar .btn,.frame.concl [data-a="snap-restore"]{display:none!important}
.sync.done i{background:var(--k1)}
.gtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--k1) 14%,transparent);color:var(--k1);font-style:normal;font-size:11px;font-weight:700;vertical-align:1px}
.glist .grow.done span{opacity:.75}
.fin-rows{list-style:none;margin:0;padding:0}
.fin-rows li{padding:10px 0;border-top:.5px solid var(--sep)}
.fin-rows li:first-child{border-top:0}
.trn{display:grid;gap:8px;margin:8px 0 12px}
.trn label{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:8px}
.trn svg{width:30px;height:21px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.trn input{min-height:40px}
.cat-pill-n{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:3px}
</style>
</head>

<div id="splash" role="presentation"><svg class="vin" viewBox="0 0 176 124" aria-hidden="true" focusable="false"><path class="vin-seg vin-sua s1" d="M90.79 18.10A40 40 0 0 1 123.95 75.53"/><path class="vin-seg s2" d="M121.16 80.37A40 40 0 0 1 54.84 80.37"/><path class="vin-seg s3" d="M52.05 75.53A40 40 0 0 1 85.21 18.10"/><circle class="vin-halo" cx="88" cy="58" r="9"/><circle class="vin-ponto" cx="88" cy="58" r="9"/></svg><span class="splash-rule"></span></div>
<script>
/* Contrato de tempo da vinheta (1,8 s, igual ao CSS) e rede de segurança:
   este bloco não depende de nada do app. Se o app não montar a tela em 6 s,
   a vinheta sai do caminho e uma mensagem legível ocupa o lugar. */
(function(){
  var DUR=1800, ate=Date.now()+DUR, PRIMEIRO=null, L='pt';
  try{ L=JSON.parse(localStorage.getItem('rateio.lang'))||'pt'; }catch(e){}
  var TX={pt:['O app não conseguiu abrir','Seus dados continuam salvos. Recarregue a página; se persistir, envie a mensagem abaixo.','Recarregar','sem detalhe'],
          en:['The app could not open','Your data is still saved. Reload the page; if it keeps happening, send the message below.','Reload','no details'],
          de:['Die App konnte nicht geöffnet werden','Deine Daten sind weiterhin gespeichert. Lade die Seite neu; wenn es weiter passiert, sende die Meldung unten.','Neu laden','keine Details']}[L]||null;
  if(!TX) TX=['O app não conseguiu abrir','Seus dados continuam salvos. Recarregue a página; se persistir, envie a mensagem abaixo.','Recarregar','sem detalhe'];
  window.addEventListener('error',function(ev){ if(!PRIMEIRO) PRIMEIRO=(ev&&ev.message)||'erro desconhecido'; },true);
  setTimeout(function(){
    var sp=document.getElementById('splash'); if(!sp) return;
    sp.classList.add('hide');
    setTimeout(function(){ sp.style.display='none'; },500);
  },Math.max(700,Math.min(4000,ate-Date.now())));
  setTimeout(function(){
    var app=document.getElementById('app');
    if(app&&app.children.length) return;
    var sp=document.getElementById('splash'); if(sp) sp.style.display='none';
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:#F2F2F0;color:#1D1D1F;font-family:-apple-system,system-ui,sans-serif');
    d.innerHTML='<div style="font-size:17px;font-weight:600">'+TX[0]+'</div>'
      +'<div style="font-size:13px;line-height:1.6;max-width:300px;color:#6E6E73">'+TX[1]+'</div>'
      +'<div style="font-size:11px;font-family:ui-monospace,monospace;color:#8A8A8E;word-break:break-word;max-width:320px">'+String(PRIMEIRO||TX[3]).replace(/</g,'&lt;')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:6px;border:none;border-radius:12px;padding:12px 22px;background:#1A3A5C;color:#fff;font-size:14px;font-weight:600">'+TX[2]+'</button>';
    document.body.appendChild(d);
  },6000);
})();
</script>

<script>
(function () {
'use strict';

/* ================= Configuração e constantes ================= */
const CFG = window.FIREBASE_CONFIG || {};
const HAS_FB = !!(CFG.apiKey && CFG.projectId);
const FB_VERSION = '10.12.2';
const APP_VERSION = '2.6';

/* ================= Idioma =================
   O app é escrito em português; __t() troca cada trecho de texto pela tradução do idioma
   escolhido (dicionário I18N no fim do arquivo). Ao mudar o idioma, o app recarrega. */
const LANGS = { pt: { loc: 'pt-BR', nome: 'Português (Brasil)', fb: 'pt-BR', mm: 'pt-BR' }, en: { loc: 'en-GB', nome: 'English', fb: 'en', mm: 'en-GB' }, de: { loc: 'de-DE', nome: 'Deutsch', fb: 'de', mm: 'de-DE' } };
let LANG = (() => { try { const v = JSON.parse(localStorage.getItem('rateio.lang')); return LANGS[v] ? v : 'pt'; } catch (e) { return 'pt'; } })();
let LOC = LANGS[LANG].loc;
try { document.documentElement.lang = LOC; } catch (e) {}
/* dicionário: chave = texto em português */
const I18N = {
  en: {"de":"of","a":"to","paga":"pays","cada":"each","ou":"or","pagou":"paid","em":"on","pagamentos.":"payments.","Sem Firebase a senha não é conferida. Contas de exemplo: milenna@exemplo.com, caio@exemplo.com.":"Without Firebase the password is not checked. Sample accounts: milenna@exemplo.com, caio@exemplo.com.","Mercado":"Groceries","Restaurante":"Restaurant","Bar e bebidas":"Bars and drinks","Hospedagem":"Accommodation","Transporte":"Transport","Combustível":"Fuel","Viagem":"Travel","Lazer":"Leisure","Esportes":"Sports","Cachorro e pets":"Dog and pets","Saúde":"Health","Farmácia":"Pharmacy","Casa":"Home","Contas":"Bills","Educação":"Education","Presentes":"Gifts","Compras":"Shopping","Assinaturas":"Subscriptions","Beleza":"Beauty","Outros":"Other","E-mail":"E-mail","voce@email.com":"you@email.com","Celular":"Mobile","Chave aleatória":"Random key","Igual":"Equal","Valores":"Amounts","partes":"shares","Partes":"Shares","despesas":"expenses","Despesas":"Expenses","Saldos":"Balances","Resumo":"Summary","Ajustes":"Settings","Manual":"Guide","Falha ao carregar":"Failed to load","Cache offline indisponível":"Offline cache unavailable","Criar um grupo precisa de internet. Tente quando estiver online.":"Creating a group needs internet. Try again when you are online.","Código não encontrado. Confira as 6 letras e números.":"Code not found. Check the 6 letters and numbers.","Remover alguém precisa de internet.":"Removing someone needs internet.","Excluir a conta precisa de internet.":"Deleting the account needs internet.","pagamentos":"payments","Excluir o grupo precisa de internet.":"Deleting the group needs internet.","Viagem Ilhabela":"Ilhabela trip","Reserva do quiosque na praia":"Beach kiosk booking","Casa de temporada (3 diárias)":"Holiday house (3 nights)","Combustível ida":"Fuel, outbound","Balsa São Sebastião":"São Sebastião ferry","Mercado da praia":"Beach supermarket","Passeio de barco":"Boat trip","Jantar no centro":"Dinner downtown","Combustível volta":"Fuel, return","Apê da Vila Mariana":"Vila Mariana flat","Condomínio":"Building fees","Energia":"Electricity","Código não encontrado. Na demonstração os códigos são ILHA26 e CASA42.":"Code not found. In the demo the codes are ILHA26 and CASA42.","Sem espaço neste aparelho para guardar o comprovante da demonstração.":"Not enough space on this device to keep the demo receipt.","O grupo aberto":"The open group","Cada grupo tem as próprias contas: uma viagem, a casa, um evento. Toque no nome para <b>trocar de grupo</b>, criar outro ou entrar com um código.":"Each group has its own expenses: a trip, a home, an event. Tap the name to <b>switch groups</b>, create another or join with a code.","Sincronização":"Sync","<b>Sincronizado</b>: todos já veem o que você lançou. <b>Enviando…</b>: subindo agora. <b>Offline</b>: fica guardado no iPhone e sobe sozinho quando a internet voltar.":"<b>Synced</b>: everyone can already see what you added. <b>Sending…</b>: uploading now. <b>Offline</b>: kept on the iPhone and uploaded by itself when the internet is back.","Seu saldo":"Your balance","<b>Positivo</b> é o que os amigos te devem (você pagou mais do que consumiu). <b>Negativo</b> é o que você deve. Quem não deve nada ganha o selo verde de <b>em dia</b>.":"<b>Positive</b> is what your friends owe you (you paid more than you used). <b>Negative</b> is what you owe. Anyone who owes nothing gets the green <b>settled</b> badge.","Lançar uma despesa":"Add an expense","O <b>+</b> abre o formulário. Quem pagou a conta lança, e o saldo de todos muda na hora. Vamos ver o formulário por dentro.":"The <b>+</b> opens the form. Whoever paid adds it, and everyone's balance changes right away. Let's look inside the form.","Valor como no app do banco":"Amount like in your banking app","Digite só os números: <b>1 2 0 5 0</b> vira <b>120,50</b>. Os centavos entram primeiro e a vírgula se ajeita sozinha.":"Type only the digits: <b>1 2 0 5 0</b> becomes <b>120.50</b>. The cents come first and the decimal point moves by itself.","Atalhos ÷ 2 e × 2":"÷ 2 and × 2 shortcuts","Aparecem quando o valor é digitado. <b>÷ 2</b> divide e <b>× 2</b> dobra o número que está no campo. Ajuda quando a conta veio junta ou repetida.":"They appear once an amount is typed. <b>÷ 2</b> halves and <b>× 2</b> doubles the number in the field. Handy when a bill came combined or twice.","Categoria":"Category","Toque no ícone da categoria. Quem criou o grupo pode criar categorias novas com ícone e cor, e elas valem para todos.":"Tap the category icon. The group creator can add new categories with icon and colour, and they apply to everyone.","Quem pagou":"Who paid","Já vem marcado com você. Troque se outra pessoa pagou a conta.":"You are selected by default. Change it if someone else paid.","Como dividir":"How to split","<b>Igual</b> entre os marcados, <b>Valores</b> exatos por pessoa ou <b>Partes</b> (um casal conta 2). A linha de baixo confirma a divisão.":"<b>Equal</b> among those ticked, exact <b>Amounts</b> per person or <b>Shares</b> (a couple counts as 2). The line below confirms the split.","Repetir em parcelas":"Repeat in instalments","Para conta que se repete (aluguel, mensalidade, parcelas do cartão): escolha <b>Toda semana</b> ou <b>Todo mês</b> e quantas vezes. O app lança cada uma na data certa.":"For bills that repeat (rent, monthly fees, card instalments): choose <b>Every week</b> or <b>Every month</b> and how many times. The app adds each one on the right date.","Avisar o grupo":"Notify the group","Ligado, os amigos veem a despesa em <b>Novidades</b> ao abrir o app, e você manda a imagem da despesa no WhatsApp.":"When on, your friends see the expense under <b>News</b> when they open the app, and you send the expense image on WhatsApp.","Histórico do grupo":"Group history","Despesas e pagamentos por mês, do mais novo para o mais antigo. Toque para ver os detalhes. Só quem lançou <b>edita ou exclui</b>; os lançamentos dos outros aparecem com um cadeado.":"Expenses and payments by month, newest first. Tap to see the details. Only the person who added it can <b>edit or delete</b>; other people's entries show a padlock.","As abas":"The tabs","<b>Saldos</b>: quem paga quem e o Pix. <b>Resumo</b>: para onde foi o dinheiro. <b>Backup</b>: salvar e restaurar. <b>Ajustes</b>: sua conta e seu Pix. <b>Manual</b>: o passo a passo.":"<b>Balances</b>: who pays whom and the Pix. <b>Summary</b>: where the money went. <b>Backup</b>: save and restore. <b>Settings</b>: your account and your Pix. <b>Guide</b>: the step by step.","O grupo na engrenagem":"The group behind the gear","A engrenagem abre o grupo: <b>enviar o convite no WhatsApp</b> (qualquer pessoa) e, para quem criou, <b>remover pessoas</b>, mudar o nome e as categorias.":"The gear opens the group: <b>send the invite on WhatsApp</b> (anyone) and, for the creator, <b>remove people</b>, change the name and the categories.","Tour quando quiser":"Tour any time","O <b>?</b> repete o tour da tela em que você estiver.":"The <b>?</b> repeats the tour of the screen you are on.","Acertos pendentes":"Pending settle-ups","Quanto falta acertar no grupo todo, quanto <b>você paga</b>, quanto <b>você recebe</b> e quantas pessoas já estão em dia.":"How much is still to settle in the whole group, how much <b>you pay</b>, how much <b>you receive</b> and how many people are already settled.","Saldo de cada um":"Everyone's balance","Barra verde à direita: tem a receber. Barra vermelha à esquerda: tem a pagar. Quem não deve nada aparece com o <b>selo verde</b>.":"Green bar on the right: has money to receive. Red bar on the left: has to pay. Anyone who owes nothing shows the <b>green badge</b>.","Quem paga quem":"Who pays whom","O app junta as dívidas e sugere o <b>menor número de Pix</b> para zerar o grupo. Nem sempre você paga para quem pagou a sua conta, mas o resultado é o mesmo.":"The app combines the debts and suggests the <b>fewest Pix transfers</b> to clear the group. You don't always pay the person who paid your share, but the result is the same.","Tudo acertado":"All settled","Quando ninguém deve nada, os acertos somem. Ao lançar uma despesa nova, eles voltam.":"When nobody owes anything, the settle-ups disappear. They come back when a new expense is added.","Pix e registro":"Pix and recording","<b>Pix</b> abre o QR Code e o <b>copia e cola já com o valor</b>. Depois de pagar no banco, toque em <b>Registrar pagamento</b>: o valor já vem preenchido com o que a pessoa deve.":"<b>Pix</b> opens the QR code and the <b>copy & paste code with the amount</b>. After paying in your bank, tap <b>Record payment</b>: the amount is already filled in with what the person owes.","Pagamentos registrados":"Recorded payments","É o registro que baixa o saldo para todos. Pagou em dinheiro ou outro valor? Registre aqui.":"Recording is what lowers the balance for everyone. Paid in cash or a different amount? Record it here.","Período":"Period","Escolha um mês ou todo o período. Tudo abaixo se ajusta.":"Choose a month or the whole period. Everything below adjusts.","Total gasto":"Total spent","Total do período, média por pessoa, <b>sua parte</b>, quanto <b>você pagou</b> e a diferença entre os dois.":"Total for the period, average per person, <b>your share</b>, how much <b>you paid</b> and the difference between them.","Por categoria":"By category","Cada categoria na sua cor, do maior gasto para o menor, com o percentual do total.":"Each category in its colour, from highest to lowest spending, with the percentage of the total.","Por pessoa":"By person","Quanto cada um pagou e consumiu no período. A diferença aqui não conta os pagamentos de acerto: para saber quem deve, use <b>Saldos</b>.":"How much each person paid and used in the period. The difference here leaves out settle-up payments: to see who owes, use <b>Balances</b>.","Backups do grupo":"Group backups","Quantas despesas e pagamentos o grupo tem e quando foi a última cópia automática neste aparelho.":"How many expenses and payments the group has and when the last automatic copy on this device was made.","Salvar um backup":"Save a backup","<b>.json</b> para restaurar depois; <b>Excel (.xlsx)</b> para ler, com abas, filtros e totais. No iPhone, salve em Arquivos ou no Google Drive.":"<b>.json</b> to restore later; <b>Excel (.xlsx)</b> to read, with tabs, filters and totals. On the iPhone, save to Files or Google Drive.","Ler e restaurar":"Read and restore","Qualquer pessoa lê um backup para conferir. Restaurar é só de quem criou o grupo, porque o backup traz os lançamentos de todos.":"Anyone can read a backup to check it. Only the group creator can restore, because the backup holds everyone's entries.","Cópias automáticas":"Automatic copies","O app guarda até 8 versões do grupo neste aparelho, sozinho, sempre que os dados mudam.":"The app keeps up to 8 versions of the group on this device, by itself, whenever the data changes.","Salvos e lidos":"Saved and read","O registro do que foi exportado, lido e restaurado neste aparelho.":"The log of what was exported, read and restored on this device.","Sua foto":"Your photo","Toque para escolher uma <b>foto do iPhone</b> (e enquadrar no círculo) ou um <b>ícone</b> com cor.":"Tap to choose an <b>iPhone photo</b> (and fit it in the circle) or an <b>icon</b> with a colour.","Perfil e Pix":"Profile and Pix","Cadastre a sua <b>chave Pix</b>. Quem te deve recebe o código pronto, com o valor certo.":"Register your <b>Pix key</b>. Whoever owes you gets the code ready, with the right amount.","E-mail e senha":"E-mail and password","<b>Trocar</b> o e-mail da conta (confirmado por um link no e-mail novo) ou a senha.":"<b>Change</b> the account e-mail (confirmed by a link sent to the new e-mail) or the password.","Ligado, o app abre com o seu rosto neste iPhone e pede de novo depois de 5 minutos fora do app.":"When on, the app opens with your face on this iPhone and asks again after 5 minutes away from the app.","Sair ou excluir a conta":"Sign out or delete the account" uem é essa pessoa no grupo atual.":"For each name listed, choose who that person is in the current group.","O app já sugere pelo nome. Confira cada um.":"The app suggests by name. Check each one.","Se a pessoa saiu do grupo, deixe <b>Manter como ex-membro</b>.":"If the person left the group, leave <b>Keep as former member</b>.","Restaurar":"Restore","Escolher o modo e restaurar":"Choose the mode and restore","Mesclar repõe o que veio no backup sem apagar o resto. Substituir deixa o grupo idêntico ao backup.":"Merge puts back what is in the backup without deleting the rest. Replace makes the group identical to the backup.","Escolha <b>Mesclar</b> ou, se você criou o grupo, <b>Substituir tudo</b>.":"Choose <b>Merge</b> or, if you created the group, <b>Replace everything</b>.","Restaurar agora":"Restore now","No Substituir tudo, toque de novo no botão para confirmar.":"With Replace everything, tap the button again to confirm.","Restaurar precisa de internet. Substituir tudo apaga para todos as despesas que não estão no backup.":"Restoring needs internet. Replace everything deletes for everyone the expenses that are not in the backup.","Automático":"Automatic","Usar as cópias automáticas do aparelho":"Use the device's automatic copies","O app guarda sozinho até 8 versões do grupo neste aparelho, sempre que os dados mudam.":"The app keeps up to 8 versions of the group on this device by itself, whenever the data changes.",", veja <b>Cópias automáticas neste aparelho</b>. Cada linha mostra data, hora e quantidade de despesas.":", see <b>Automatic copies on this device</b>. Each line shows date, time and number of expenses.","na versão desejada e siga as etapas 3 e 4.":"on the version you want and follow steps 3 and 4.","Ou toque em":"Or tap","para guardar a cópia fora do celular.":"to keep the copy outside the phone.","As cópias automáticas ficam só neste aparelho. Limpar os dados do Safari apaga as cópias; o backup exportado é o que fica guardado de verdade.":"Automatic copies stay on this device only. Clearing Safari's data deletes them; the exported backup is what is really kept.","Recuperar a senha":"Recover the password","Do link pedido na tela de entrada até entrar de novo com a senha nova.":"From the link requested on the sign-in screen to signing in again with the new password.","Entrada":"Sign-in","Pedir o link na tela de entrada":"Request the link on the sign-in screen","A senha não é enviada nem mostrada. O link permite criar uma senha nova.":"The password is never sent or shown. The link lets you create a new one.","Na tela de entrada, toque em":"On the sign-in screen, tap","Digite o e-mail da conta.":"Type the account e-mail.","Abrir o e-mail e criar a senha nova":"Open the e-mail and create the new password","O e-mail chega em português, enviado pelo Firebase em nome do app.":"The e-mail arrives in English, sent by Firebase on behalf of the app.","Abra o e-mail de redefinição de senha. Confira também o spam.":"Open the password reset e-mail. Check the spam folder too.","Toque no link.":"Tap the link.","Digite a senha nova e salve.":"Type the new password and save.","O link vale por tempo limitado. Se expirar, peça outro na tela de entrada.":"The link is valid for a limited time. If it expires, request another one on the sign-in screen.","Voltar ao app":"Back to the app","A senha antiga deixa de valer em todos os aparelhos.":"The old password stops working on all devices.","Volte ao wirteilen e entre com o e-mail e a senha nova.":"Go back to wirteilen and sign in with the e-mail and the new password.","Já logado, dá para trocar a senha em":"Once signed in, you can change the password in","› <b>Conta e acesso</b> › Senha ›":"› <b>Account and access</b> › Password ›","O número grande no topo da aba Despesas.":"The big number at the top of the Expenses tab.","Soma tudo o que você pagou pelo grupo e subtrai a sua parte em cada despesa e os pagamentos já registrados.":"Adds up everything you paid for the group and subtracts your share in each expense and the payments already recorded.","Com sinal de mais, é o que os amigos te devem (você pagou mais do que consumiu); com sinal de menos, o que você deve. Toque em <b>Acertos</b> para saber para quem pagar.":"With a plus sign, it is what your friends owe you (you paid more than you used); with a minus sign, what you owe. Tap <b>Settle-ups</b> to know whom to pay.","Se você pagou e o saldo continua zero, a divisão incluiu só você: sozinho no grupo, ou só o seu nome marcado. Ao entrar mais gente e lançar dividindo com eles, o valor aparece. O saldo vale para o grupo aberto.":"If you paid and the balance stays at zero, the split included only you: alone in the group, or only your name ticked. Once more people join and you split with them, the amount appears. The balance is for the open group.","Selo de em dia":"Settled badge","O selo verde ao lado do nome.":"The green badge next to the name.","Marca quem não deve nada no grupo: saldo zero ou a receber.":"Marks whoever owes nothing in the group: zero balance or money to receive.","Aparece nos saldos, nas listas e no seu perfil. Some quando a pessoa passa a dever e volta quando ela registra o pagamento.":"Appears in the balances, the lists and your profile. It disappears when the person starts owing and returns when they record the payment.","Vale para o grupo aberto. Em outro grupo, a mesma pessoa pode estar sem selo.":"Applies to the open group. In another group, the same person may have no badge.","Parcelas e contas fixas":"Instalments and fixed bills","Repetir toda semana ou todo mês.":"Repeat every week or every month.","Lança a mesma despesa várias vezes, uma em cada data.":"Adds the same expense several times, one on each date.","No formulário da despesa, em <b>Repetir</b>, escolha a frequência e quantas vezes. A prévia mostra as datas e o total.":"In the expense form, in <b>Repeat</b>, choose the frequency and how many times. The preview shows the dates and the total.","Cada parcela é uma despesa própria e pode ser editada ou excluída sozinha.":"Each instalment is its own expense and can be edited or deleted on its own.","Digitar o valor":"Typing the amount","Como no app do banco, com ÷ 2 e × 2.":"Like in your banking app, with ÷ 2 and × 2.","Os números entram pelos centavos: 1, 2, 0, 5, 0 vira 120,50.":"Digits come in from the cents: 1, 2, 0, 5, 0 becomes 120.50.","Ao digitar, aparecem <b>÷ 2</b> e <b>× 2</b>, que dividem ou dobram o valor do campo.":"While typing, <b>÷ 2</b> and <b>× 2</b> appear, halving or doubling the amount in the field.","Para apagar, use o ⌫ do teclado. O campo seleciona tudo ao ser tocado, para trocar o valor de uma vez.":"To delete, use the keyboard's ⌫. The field selects everything when tapped, so you can replace the amount at once.","Novidades e mensagem no WhatsApp.":"News and WhatsApp message.","Mostra a despesa em <b>Novidades</b> para os amigos, com um número na aba Despesas.":"Shows the expense under <b>News</b> for your friends, with a number on the Expenses tab.","Ligue <b>Avisar o grupo</b> ao lançar. Depois, toque em WhatsApp ou Compartilhar para mandar a mensagem pronta.":"Turn on <b>Notify the group</b> when adding. Then send the image on WhatsApp.","O wirteilen não manda notificação no celular com o app fechado: isso exige um servidor pago. O aviso aparece quando o amigo abre o app.":"wirteilen doesn't send phone notifications with the app closed: that needs a paid server. The notice shows up when your friend opens the app.","20 de base e as do grupo.":"20 base ones plus the group's own.","Organiza as despesas no Resumo, cada uma com ícone e cor.":"Organises the expenses in the Summary, each with an icon and colour.","Quem criou o grupo cria categorias novas no formulário da despesa ou na engrenagem do topo, em <b>Categorias do grupo</b>.":"The group creator makes new categories in the expense form or behind the gear at the top, in <b>Group categories</b>.","Ao excluir uma categoria do grupo, as despesas dela passam a aparecer em Outros.":"When a group category is deleted, its expenses show up under Other.","Foto de perfil":"Profile photo","Foto do iPhone ou ícone.":"iPhone photo or icon.","Mostra a sua imagem ao lado do nome em todo o app.":"Shows your picture next to your name throughout the app.","Em Ajustes, toque na sua foto no topo. Ao escolher uma foto, arraste e faça pinça para enquadrar no círculo.":"In Settings, tap your photo at the top. When choosing a photo, drag and pinch to fit it in the circle.","A foto é reduzida para um ícone pequeno antes de ir para a base. Só quem está nos seus grupos vê.":"The photo is reduced to a small icon before going to the database. Only people in your groups see it.","Abrir o app com o rosto.":"Open the app with your face.","Protege o app aberto neste iPhone com o Face ID (ou Touch ID).":"Protects the open app on this iPhone with Face ID (or Touch ID).","Ligue em Ajustes › Conta e segurança. O primeiro acesso é sempre com e-mail e senha.":"Turn it on in Settings › Account and access. The first sign-in is always with e-mail and password.","O Face ID fica no aparelho: o app nunca recebe a imagem do rosto. Em outro aparelho, ligue de novo.":"Face ID stays on the device: the app never receives the image of your face. On another device, turn it on again.","Convites no WhatsApp":"Invites on WhatsApp","Para o grupo ou para o app.":"For the group or for the app.","Manda uma imagem com o visual do app: o código do grupo e os passos para entrar, ou o que o app faz e como instalar.":"Sends an image with the app's look: the group code and the steps to join, or what the app does and how to install it.","Na engrenagem do topo: <b>Enviar convite no WhatsApp</b> ou <b>Indicar o wirteilen no WhatsApp</b>.":"Behind the gear at the top: <b>Send invite on WhatsApp</b> or <b>Recommend wirteilen on WhatsApp</b>.","A imagem vai com uma legenda só com o link, que fica clicável no WhatsApp. Quem toca no link do convite entra direto no grupo depois de criar a conta.":"The image goes with a caption that has only the link, which is clickable on WhatsApp. Whoever taps the invite link goes straight into the group after creating the account.","Foto da nota ou do Pix.":"Photo of the bill or the Pix.","Anexa uma foto à despesa ou ao pagamento. Na lista, aparece um clipe ao lado da data.":"Attaches a photo to the expense or payment. A paperclip shows next to the date in the list.","No formulário, toque em <b>Anexar foto do comprovante</b> e tire a foto ou escolha da galeria. Para ver, toque no clipe; toque na imagem para ampliar.":"In the form, tap <b>Attach receipt photo</b> and take the photo or choose from the gallery. To see it, tap the paperclip; tap the image to zoom.","O app sempre compacta a foto antes de guardar (lado maior de até 1280 px, por volta de 180 KB), para não gastar o espaço gratuito da base. Só quem lançou troca ou remove o comprovante.":"The app always compresses the photo before storing it (longest side up to 1280 px, about 180 KB), to save the database's free space. Only the person who added it can change or remove the receipt.","Planilha Excel":"Excel spreadsheet","Histórico do grupo em abas.":"Group history in tabs.","Gera um arquivo .xlsx com as abas Resumo, Despesas, Partes e Pagamentos, com cabeçalho, filtros, datas, moeda em R$ e totais.":"Creates an .xlsx file with Summary, Expenses, Shares and Payments tabs, with header, filters, dates, R$ currency and totals.","Na aba Backup, toque em <b>Excel (.xlsx)</b>. No iPhone, salve em Arquivos ou abra no Excel.":"In the Backup tab, tap <b>Excel (.xlsx)</b>. On the iPhone, save to Files or open in Excel.","A aba Partes tem uma linha por pessoa em cada despesa: é a melhor para montar tabela dinâmica por pessoa, mês ou categoria.":"The Shares tab has one row per person in each expense: the best one for a pivot table by person, month or category.","Despesa, convite e Pix como imagem.":"Expense, invite and Pix as an image.","Monta uma imagem com o visual do app: a despesa com a divisão, o convite com o código ou a cobrança Pix com o QR Code.":"Builds an image with the app's look: the expense with the split, the invite with the code or the Pix request with the QR code.","Toque em <b>Enviar no WhatsApp</b>, escolha WhatsApp na lista do iPhone e a conversa.":"Tap <b>Send on WhatsApp</b>, choose WhatsApp in the iPhone list and the chat.","A imagem não leva texto junto: na legenda vai só o link do app ou do convite (clicável no WhatsApp). Na cobrança Pix, a legenda é o Pix copia e cola, para copiar com um toque.":"The image goes with no text: the caption has only the app or invite link (clickable on WhatsApp). In the Pix request, the caption is the Pix copy & paste code, to copy with one tap.","Trocar e-mail ou senha":"Change e-mail or password","Ajustes › Conta e acesso.":"Settings › Account and access.","Troca o e-mail de entrada ou a senha da conta.":"Changes the sign-in e-mail or the account password.","Toque em <b>Trocar</b> na linha do e-mail ou da senha. O app pede a senha atual para confirmar que é você.":"Tap <b>Change</b> on the e-mail or password line. The app asks for the current password to confirm it is you.","O e-mail novo só vale depois que você tocar no link que chega nele.":"The new e-mail only counts after you tap the link sent to it.","Excluir a conta":"Delete the account","Ajustes › Conta e segurança.":"Settings › Account and access.","Apaga o seu login, o perfil, a chave Pix e a foto.":"Deletes your login, profile, Pix key and photo.","Toque em <b>Excluir minha conta</b>, confirme a senha e marque a confirmação.":"Tap <b>Delete my account</b>, confirm the password and tick the confirmation.","Nos grupos de outras pessoas, você sai e suas despesas ficam como ex-membro. Nos que você criou, o grupo passa para outro membro; se só você estiver nele, é excluído. Faça os acertos antes.":"In other people's groups, you leave and your expenses stay as a former member. In the ones you created, the group passes to another member; if you are the only one in it, it is deleted. Settle up first.","Só quem criou o grupo.":"Only the group creator.","Tira a pessoa do grupo. Ela continua no histórico como ex-membro.":"Takes the person out of the group. They stay in the history as a former member.","Engrenagem do topo › <b>Remover</b> ao lado do nome, e toque de novo para confirmar.":"Gear at the top › <b>Remove</b> next to the name, and tap again to confirm.","O app avisa se a pessoa ainda tem saldo. Acerte antes de remover.":"The app warns if the person still has a balance. Settle up before removing.","A versão aparece na tela de entrada e no fim de Ajustes.":"The version appears on the sign-in screen and at the end of Settings.","Ao relatar um problema, diga a versão.":"When reporting a problem, mention the version.","Modos de divisão":"Split modes","Igual, Valores e Partes.":"Equal, Amounts and Shares.","Define quanto da despesa cabe a cada pessoa.":"Defines how much of the expense belongs to each person.","<b>Igual</b> divide entre os marcados. <b>Valores</b> recebe o valor exato de cada um. <b>Partes</b> divide por peso (2 partes pagam o dobro de 1).":"<b>Equal</b> splits among those ticked. <b>Amounts</b> takes each person's exact amount. <b>Shares</b> splits by weight (2 shares pay double of 1).","Os centavos que sobram de uma divisão vão para as primeiras pessoas da lista, para a soma fechar com o total.":"Leftover cents from a split go to the first people on the list, so the sum matches the total.","Quem paga quem para zerar o grupo.":"Who pays whom to clear the group.","Calcula o menor número de transferências que zera todos os saldos.":"Works out the fewest transfers that clear all balances.","Cada linha tem o botão de Pix de quem recebe e o botão de registrar o pagamento.":"Each line has the Pix button of whoever receives and the button to record the payment.","Os acertos mudam a cada despesa lançada. Registre os pagamentos logo após o Pix para a lista ficar certa para todos.":"Settle-ups change with every expense added. Record payments right after the Pix so the list stays right for everyone.","Pix copia e cola":"Pix copy & paste","Código com chave, nome e valor.":"Code with key, name and amount.","Monta o código Pix no padrão do Banco Central (BR Code) com o valor do acerto.":"Builds the Pix code in the Banco Central standard (BR Code) with the settle-up amount.","Copie o código e cole em <b>Pix › Pix copia e cola</b> no app do banco. O QR Code serve para outra pessoa escanear.":"Copy the code and paste it into <b>Pix › Pix copy & paste</b> in your banking app. The QR code is for another person to scan.","O nome e a cidade vêm do perfil de quem recebe. Se o banco recusar, confira a chave em Ajustes.":"The name and city come from the recipient's profile. If the bank refuses it, check the key in Settings.","Indicador de sincronização":"Sync indicator","O texto ao lado do nome do grupo.":"The text next to the group name.","Mostra se o que você lançou já chegou à base online.":"Shows whether what you added has reached the online database.","<b>Sincronizado</b>: todos já veem. <b>Enviando…</b>: subindo agora. <b>Offline</b>: salvo no aparelho, sobe quando a internet voltar.":"<b>Synced</b>: everyone sees it. <b>Sending…</b>: uploading now. <b>Offline</b>: saved on the device, uploads when the internet is back.","Se ficar parado em Enviando, use <b>Forçar sincronização</b> em Ajustes.":"If it stays on Sending, use <b>Force sync</b> in Settings.","Sem internet":"No internet","O que funciona e o que não funciona offline.":"What works and what doesn't offline.","O app abre, mostra os dados e aceita lançamentos sem conexão.":"The app opens, shows the data and accepts entries without connection.","Lance normalmente. Os dados ficam guardados no aparelho e sobem sozinhos.":"Add things as usual. The data is kept on the device and uploads by itself.","Precisam de internet: entrar em grupo por código, restaurar backup, criar conta e recuperar senha.":"These need internet: joining a group by code, restoring a backup, creating an account and recovering the password.","Totais por período, categoria e pessoa.":"Totals by period, category and person.","Mostra o total gasto, a sua parte, quanto você pagou e a divisão por categoria.":"Shows the total spent, your share, how much you paid and the split by category.","Escolha o mês em <b>Período</b>. A tabela Por pessoa compara o que cada um pagou e consumiu.":"Choose the month in <b>Period</b>. The By person table compares what each person paid and used.","A diferença do Resumo não conta os pagamentos de acerto. Para saber quem deve, use a aba Saldos.":"The Summary difference doesn't count settle-up payments. To know who owes, use the Balances tab.","Editar e excluir":"Edit and delete","Só quem lançou corrige.":"Only the person who added it corrects it.","Só quem lançou a despesa (ou registrou o pagamento) pode alterar ou excluir. Os outros veem os detalhes com um cadeado.":"Only the person who added the expense (or recorded the payment) can change or delete it. Others see the details with a padlock.","Toque no item na lista. Para excluir, toque em Excluir e depois toque de novo para confirmar.":"Tap the item in the list. To delete, tap Delete and then tap again to confirm.","A despesa mostra quem lançou e quando foi alterada. Exportar o backup antes de grandes correções é uma boa garantia.":"The expense shows who added it and when it was changed. Exporting the backup before big corrections is a good safeguard.","Privacidade e segurança":"Privacy and security","Quem vê o quê.":"Who sees what.","Só quem está no grupo lê as despesas, os saldos e as chaves Pix daquele grupo.":"Only people in the group can read that group's expenses, balances and Pix keys.","Para alguém entrar, é preciso ter conta e o código de convite.":"To join, a person needs an account and the invite code.","As regras de acesso ficam na base de dados, não no app. Mesmo alguém com o endereço do site não lê nada sem estar no grupo.":"The access rules live in the database, not in the app. Even someone with the site address reads nothing without being in the group.","Tela de entrada. O link <b>Esqueceu a senha?</b> fica logo abaixo do botão Entrar.":"Sign-in screen. The <b>Forgot password?</b> link sits right below the Sign in button.","Tela de entrada, com a opção <b>Criar conta</b> selecionada.":"Sign-in screen, with the <b>Create account</b> option selected.","Grupo · 4 pessoas":"Group · 4 people","<b>Viagem Ilhabela</b>":"<b>Ilhabela trip</b>","<i></i>Sincronizado":"<i></i>Synced","Topo do app. Tocar no <b>nome do grupo</b> abre a lista dos seus grupos, com as opções de criar e de entrar com código.":"Top of the app. Tapping the <b>group name</b> opens your groups list, with the options to create and to join with a code.","Bloco <b>Meu perfil e Pix</b>, o primeiro da aba Ajustes.":"The <b>My profile and Pix</b> block, the first in the Settings tab.","Copiar convite":"Copy invite","Tela do grupo, aberta pela engrenagem do topo. Cada grupo tem o próprio código.":"Group screen, opened by the gear at the top. Each group has its own code.","Adicionar à Tela de Início":"Add to Home Screen","Barra do Safari no iPhone. O botão <b>Compartilhar</b> é o quadrado com a seta para cima.":"Safari bar on the iPhone. The <b>Share</b> button is the square with the arrow pointing up.","O botão + fica no topo, à direita do nome do grupo, nas abas Despesas e Saldos.":"The + button is at the top, to the right of the group name, on the Expenses and Balances tabs.","5 partes · R$ 112,00 por parte":"5 shares · R$ 112.00 per share","Modo <b>Partes</b>: Caio levou acompanhante e conta 2 partes. A linha de baixo confirma a divisão.":"<b>Shares</b> mode: Caio brought a guest and counts as 2 shares. The line below confirms the split.","<b>Você</b> paga <b>Caio</b>":"<b>You</b> pay <b>Caio</b>","Uma linha de <b>Acertos sugeridos</b>. Quando quem recebe é você, o botão vira <b>Mostrar meu Pix</b>.":"A line of <b>Suggested settle-ups</b>. When the recipient is you, the button becomes <b>Show my Pix</b>.","Pix copia e cola · valor incluso":"Pix copy & paste · amount included","Tela de Pix. O QR Code serve para outra pessoa escanear; no mesmo celular, use o botão de copiar.":"Pix screen. The QR code is for another person to scan; on the same phone, use the copy button.","<b>Mesclar</b>":"<b>Merge</b>","Mantém o que já está no grupo e repõe o backup.":"Keeps what is already in the group and puts back the backup.","<b>Substituir tudo</b>":"<b>Replace everything</b>","Deixa o grupo igual ao backup.":"Makes the group equal to the backup.","Fim da tela <b>Restaurar backup</b>. Substituir tudo só aparece para quem criou o grupo.":"End of the <b>Restore backup</b> screen. Replace everything only shows for the group creator.","<i></i>Enviando…":"<i></i>Sending…","<i></i>Offline · salvo aqui":"<i></i>Offline · saved here","<i></i>Neste aparelho (demonstração)":"<i></i>On this device (demo)","Anterior":"Previous",">Próxima":">Next","Ver por etapa":"See step by step","Ver tudo de uma vez":"See everything at once","etapas":"steps","Etapa":"Step","Começar":"Start","O que faz":"What it does","Como usar":"How to use","Detalhes":"Details","resultado":"result","resultados":"results","para “":"for “","Nada encontrado para “":"Nothing found for “","”. Tente outra palavra, como Pix, backup ou senha.":"”. Try another word, such as Pix, backup or password.","Tour guiado · v":"Guided tour · v","Conheça o wirteilen tela por tela":"Get to know wirteilen screen by screen","O tour destaca cada recurso e explica para que serve. Feche quando quiser no ×, em Pular ou na tecla Esc.":"The tour highlights each feature and explains what it is for. Close it any time with ×, Skip or the Esc key.","Fazer o tour completo":"Take the full tour","Passo a passo dos caminhos principais e consulta rápida do que cada parte do app faz.":"Step by step guides for the main paths and a quick reference of what each part of the app does.","Buscar: Pix, parcelas, Face ID…":"Search: Pix, instalments, Face ID…","Buscar no manual":"Search the guide","a receber":"to receive","só você":"just you","sua parte":"your share","fora da divisão":"not in the split","Só quem lançou edita":"Only the person who added it can edit","Tem comprovante":"Has a receipt","pagou ·":"paid ·","Só quem registrou edita":"Only the person who recorded it can edit","Acerto":"Settle-up","Novidades no grupo":"News in the group","</b> lançou <b>":"</b> added <b>","Sua parte:":"Your share:","Você não entrou na divisão":"You weren't in the split","E mais":"And more","Entendi":"Got it","<b>Só você está neste grupo</b>Enquanto os amigos não entram, cada despesa fica inteira na sua parte e o saldo não muda.":"<b>Only you are in this group</b>Until your friends join, each expense stays fully in your share and the balance doesn't change.","Convidar amigos":"Invite friends","Nova":"New","Nenhuma categoria com esse nome.":"No category with that name.","Ex.: Futebol de quinta":"E.g.: Thursday football","Nome da nova categoria":"New category name","Nome nos outros idiomas":"Name in the other languages","Ícone":"Icon","Cor":"Colour","Cancelar":"Cancel","Criar categoria":"Create category","Só quem criou o grupo cria categorias. Elas valem para todos do grupo.":"Only the group creator makes categories. They apply to everyone in the group.","A 1.0 traz inglês e alemão, moeda com o câmbio do Banco Central, filtros, busca de categoria e concluir grupo. A 0.9 permite anexar comprovante como foto, sempre compactada. A 0.8 deixa os envios só pelo WhatsApp, como imagem com o link na legenda. A 0.7 deixa o selo de em dia verde e troca a planilha .csv por um Excel formatado. A 0.6 leva o grupo para a engrenagem do topo, cria a aba Backup, deixa Ajustes só com a sua conta e manda despesas, convites e Pix como imagem. A 0.5 traz a tela de entrada nova, com o logo animado. A 0.4 permite enquadrar a foto de perfil com z gested translation, and the group creator can correct the names under the gear, in Categories.","Ver os valores em outra moeda.":"See amounts in another currency.","Mostra e deixa digitar os valores em dólar, euro, libra e outras moedas, convertendo pelo câmbio do dia.":"Shows and lets you type amounts in dollars, euros, pounds and other currencies, converted at today's rate.","Em <b>Ajustes › Moeda e câmbio</b>, escolha a moeda e toque em <b>Atualizar com o câmbio do dia</b>. Se não houver conexão com o Banco Central, digite a taxa à mão.":"In <b>Settings › Currency and exchange rate</b>, choose the currency and tap <b>Update with today's rate</b>. If Banco Central cannot be reached, type the rate yourself.","A taxa é a PTAX de venda do Banco Central do Brasil (último fechamento). Os valores continuam guardados em reais, então o grupo não muda para os outros. O Pix é sempre em reais.":"The rate is the Banco Central do Brasil PTAX selling rate (latest close). Amounts stay stored in reais, so nothing changes for the others in the group. Pix is always in reais.","Buscar e filtrar":"Search and filter","Achar uma despesa ou categoria.":"Find an expense or category.","Na aba Despesas, busca pelo nome e filtra por categoria, pessoa e tipo, com ordem por data, valor ou nome. No lançamento, a busca acha a categoria pelo nome.":"In the Expenses tab, searches by name and filters by category, person and type, sorted by date, amount or name. When adding an expense, search finds the category by name.","Digite no campo <b>Buscar</b> ou toque em <b>Filtros</b>. O <b>x</b> à direita do campo apaga a busca; <b>Limpar filtros</b> desfaz toda busca, filtro e ordem de uma vez.":"Type in the <b>Search</b> field or tap <b>Filters</b>. The <b>x</b> on the right of the field clears the search; <b>Clear filters</b> undoes every search, filter and sort at once.","A busca ignora acentos e maiúsculas e só atualiza a lista quando você para de digitar, para não travar. O total filtrado aparece acima da lista.":"Search ignores accents and capitals and only updates the list when you stop typing, so it never lags. The filtered total appears above the list.","Concluir o grupo":"Complete the group","Fechar uma viagem ou evento.":"Close a trip or event.","Deixa o grupo só para consulta, com o resumo final de quem pagou, quem consumiu e os acertos.":"Makes the group read-only, with the final summary of who paid, who used what and the settlements.","Quem criou o grupo toca na <b>engrenagem</b> do topo e em <b>Concluir grupo</b>. Para voltar a lançar, usa <b>Reabrir grupo</b> no mesmo lugar.":"The group creator taps the <b>gear</b> at the top and then <b>Complete group</b>. To add entries again, use <b>Reopen group</b> in the same place.","Todos continuam vendo o grupo e o resumo ao selecioná-lo, e seguem usando os outros grupos normalmente. Ninguém lança, edita ou registra pagamento enquanto ele estiver concluído.":"Everyone can still see the group and its summary when they select it, and keeps using their other groups as usual. Nobody adds, edits or records payments while it is completed.","Em reais":"In reais","Moeda":"Currency","Valor na moeda":"Amount in currency","Câmbio":"Exchange rate","Valores em reais. Despesas em outra moeda mostram também a moeda, o valor original e o câmbio usado. As colunas \"Parte\" mostram quanto cada pessoa consumiu em cada despesa. Use os filtros do cabeçalho.":"Amounts in reais. Expenses in another currency also show the currency, the original amount and the rate used. The \"Share\" columns show how much each person used in each expense. Use the header filters.","Moeda da despesa":"Expense currency","Câmbio: quantos reais vale 1 unidade da moeda":"Exchange rate: how many reais 1 unit of the currency is worth","Câmbio do dia":"Today's rate","Taxa digitada à mão":"Rate typed manually","PTAX de venda do Banco Central de":"Banco Central PTAX selling rate of","Informe o câmbio ou toque em Câmbio do dia.":"Enter the rate or tap Today's rate.",". Cada um entra no mês em que vence.":". Each one goes into the month it falls due.","Informe o câmbio da moeda.":"Enter the exchange rate.","manual":"manual","Lançar em dólar, euro e outras.":"Add expenses in dollars, euros and more.","Lança a despesa na moeda em que ela foi paga e converte para reais pelo câmbio do dia, para os saldos e o Pix.":"Records the expense in the currency it was paid in and converts it to reais at today's rate, for balances and Pix.","Em <b>Nova despesa</b>, escolha a moeda ao lado do valor (BRL é o padrão). O app busca o câmbio do dia; toque em <b>Câmbio do dia</b> para atualizar ou digite a taxa.":"In <b>New expense</b>, choose the currency next to the amount (BRL is the default). The app fetches today's rate; tap <b>Today's rate</b> to refresh it or type the rate yourself.","A taxa é a PTAX de venda do Banco Central do Brasil (último fechamento). A despesa guarda o valor na moeda, o câmbio usado e o valor em reais; saldos, resumo e Pix ficam sempre em reais. O app lembra a última moeda usada em cada grupo.":"The rate is the Banco Central do Brasil PTAX selling rate (latest close). The expense keeps the amount in its currency, the rate used and the amount in reais; balances, summary and Pix are always in reais. The app remembers the last currency used in each group.","A 1.1 leva a escolha da moeda para a própria despesa e troca o idioma na hora, sem reiniciar. A 1.0 traz inglês e alemão, moeda com o câmbio do Banco Central, filtros, busca de categoria e concluir grupo. A 0.9 permite anexar comprovante como foto, sempre compactada. A 0.8 deixa os envios só pelo WhatsApp, como imagem com o link na legenda. A 0.7 deixa o selo de em dia verde e troca a planilha .csv por um Excel formatado. A 0.6 leva o grupo para a engrenagem do topo, cria a aba Backup, deixa Ajustes só com a sua conta e manda despesas, convites e Pix como imagem. A 0.5 traz a tela de entrada nova, com o logo animado. A 0.4 permite enquadrar a foto de perfil com zoom e arrastando. A 0.3 deixa só quem lançou editar ou excluir, permite excluir a própria conta e deixa mais claro como remover alguém do grupo. A 0.2 organiza categorias, ícones e cores em grade, sem nada rolar para o lado, e faz o iPhone pegar as atualizações na hora. A 0.1 trouxe cores por aba, foto de perfil, Face ID, parcelas, categorias do grupo, convites por e-mail, exclusão do grupo com histórico e o tour guiado.":"Version 1.1 moves the currency choice into the expense itself and switches language instantly, without restarting. 1.0 brings English and German, currency with the Banco Central rate, filters, category search and completing groups. 0.9 lets you attach receipts as compressed photos. 0.8 sends only via WhatsApp, as an image with the link in the caption. 0.7 makes the settled badge green and replaces the .csv with a formatted Excel. 0.6 moves the group behind the gear at the top, creates the Backup tab, keeps only your account in Settings and sends expenses, invites and Pix as images. 0.5 brings the new sign-in screen with the animated logo. 0.4 lets you frame the profile photo with zoom and drag. 0.3 lets only the person who added an entry edit or delete it, allows deleting your own account and makes removing someone clearer. 0.2 arranges categories, icons and colours in a grid with no sideways scrolling, and makes the iPhone get updates right away. 0.1 brought colours per tab, profile photo, Face ID, instalments, group categories, e-mail invites, group deletion with history and the guided tour.","<b>Positivo</b> é o que os amigos te devem (você pagou mais do que consumiu). <b>Negativo</b> é o que você deve. Quem não deve nada ganha a medalha 🥇 de <b>em dia</b>.":"<b>Positive</b> is what your friends owe you (you paid more than you used). <b>Negative</b> is what you owe. Anyone who owes nothing gets the 🥇 <b>settled</b> medal.","Barra verde à direita: tem a receber. Barra vermelha à esquerda: tem a pagar. Quem não deve nada aparece com a <b>medalha 🥇   de: {"de":"von","a":"bis","paga":"zahlt","cada":"je","ou":"oder","pagou":"zahlte","em":"am","pagamentos.":"Zahlungen.","Sem Firebase a senha não é conferida. Contas de exemplo: milenna@exemplo.com, caio@exemplo.com.":"Ohne Firebase wird das Passwort nicht geprüft. Beispielkonten: milenna@exemplo.com, caio@exemplo.com.","Mercado":"Lebensmittel","Restaurante":"Restaurant","Bar e bebidas":"Bars und Getränke","Hospedagem":"Unterkunft","Transporte":"Transport","Combustível":"Kraftstoff","Viagem":"Reisen","Lazer":"Freizeit","Esportes":"Sport","Cachorro e pets":"Hund und Haustiere","Saúde":"Gesundheit","Farmácia":"Apotheke","Casa":"Zuhause","Contas":"Rechnungen","Educação":"Bildung","Presentes":"Geschenke","Compras":"Einkäufe","Assinaturas":"Abos","Beleza":"Schönheit","Outros":"Sonstiges","E-mail":"E-Mail","voce@email.com":"du@email.de","Celular":"Handy","Chave aleatória":"Zufälliger Schlüssel","Igual":"Gleich","Valores":"Beträge","partes":"Anteile","Partes":"Anteile","despesas":"Ausgaben","Despesas":"Ausgaben","Saldos":"Salden","Resumo":"Übersicht","Ajustes":"Einstellungen","Manual":"Anleitung","Falha ao carregar":"Laden fehlgeschlagen","Cache offline indisponível":"Offline-Cache nicht verfügbar","Criar um grupo precisa de internet. Tente quando estiver online.":"Zum Erstellen einer Gruppe brauchst du Internet. Versuch es erneut, wenn du online bist.","Código não encontrado. Confira as 6 letras e números.":"Code nicht gefunden. Prüf die 6 Buchstaben und Ziffern.","Remover alguém precisa de internet.":"Zum Entfernen einer Person brauchst du Internet.","Excluir a conta precisa de internet.":"Zum Löschen des Kontos brauchst du Internet.","pagamentos":"Zahlungen","Excluir o grupo precisa de internet.":"Zum Löschen der Gruppe brauchst du Internet.","Viagem Ilhabela":"Reise nach Ilhabela","Reserva do quiosque na praia":"Reservierung des Strandkiosks","Casa de temporada (3 diárias)":"Ferienhaus (3 Nächte)","Combustível ida":"Tanken, Hinfahrt","Balsa São Sebastião":"Fähre São Sebastião","Mercado da praia":"Supermarkt am Strand","Passeio de barco":"Bootsausflug","Jantar no centro":"Abendessen in der Stadt","Combustível volta":"Tanken, Rückfahrt","Apê da Vila Mariana":"Wohnung in Vila Mariana","Condomínio":"Nebenkosten","Energia":"Strom","Código não encontrado. Na demonstração os códigos são ILHA26 e CASA42.":"Code nicht gefunden. In der Demo lauten die Codes ILHA26 und CASA42.","Sem espaço neste aparelho para guardar o comprovante da demonstração.":"Nicht genug Speicher auf diesem Gerät für den Beleg der Demo.","O grupo aberto":"Die geöffnete Gruppe","Cada grupo tem as próprias contas: uma viagem, a casa, um evento. Toque no nome para <b>trocar de grupo</b>, criar outro ou entrar com um código.":"Jede Gruppe hat eigene Ausgaben: eine Reise, eine Wohnung, ein Event. Tipp auf den Namen, um <b>die Gruppe zu wechseln</b>, eine neue zu erstellen oder mit einem Code beizutreten.","Sincronização":"Synchronisierung","<b>Sincronizado</b>: todos já veem o que você lançou. <b>Enviando…</b>: subindo agora. <b>Offline</b>: fica guardado no iPhone e sobe sozinho quando a internet voltar.":"<b>Synchronisiert</b>: alle sehen schon, was du erfasst hast. <b>Wird gesendet…</b>: wird gerade hochgeladen. <b>Offline</b>: bleibt auf dem iPhone und wird automatisch hochgeladen, sobald wieder Internet da ist.","Seu saldo":"Dein Saldo","<b>Positivo</b> é o que os amigos te devem (você pagou mais do que consumiu). <b>Negativo</b> é o que você deve. Quem não deve nada ganha o selo verde de <b>em dia</b>.":"<b>Positiv</b> ist, was deine Freunde dir schulden (du hast mehr bezahlt als verbraucht). <b>Negativ</b> ist, was du schuldest. Wer nichts schuldet, bekommt das grüne Abzeichen <b>ausgeglichen</b>.","Lançar uma despesa":"Ausgabe erfassen","O <b>+</b> abre o formulário. Quem pagou a conta lança, e o saldo de todos muda na hora. Vamos ver o formulário por dentro.":"Das <b>+</b> öffnet das Formular. Wer bezahlt hat, erfasst die Ausgabe, und alle Salden ändern sich sofort. Schauen wir uns das Formular an.","Valor como no app do banco":"Betrag wie in der Banking-App","Digite só os números: <b>1 2 0 5 0</b> vira <b>120,50</b>. Os centavos entram primeiro e a vírgula se ajeita sozinha.":"Tipp nur die Ziffern: <b>1 2 0 5 0</b> wird zu <b>120,50</b>. Die Cent kommen zuerst, das Komma setzt sich von selbst.","Atalhos ÷ 2 e × 2":"Kurzbefehle ÷ 2 und × 2","Aparecem quando o valor é digitado. <b>÷ 2</b> divide e <b>× 2</b> dobra o número que está no campo. Ajuda quando a conta veio junta ou repetida.":"Sie erscheinen, sobald ein Betrag eingegeben ist. <b>÷ 2</b> halbiert und <b>× 2</b> verdoppelt die Zahl im Feld. Praktisch, wenn eine Rechnung zusammen oder doppelt kam.","Categoria":"Kategorie","Toque no ícone da categoria. Quem criou o grupo pode criar categorias novas com ícone e cor, e elas valem para todos.":"Tipp auf das Symbol der Kategorie. Wer die Gruppe erstellt hat, kann neue Kategorien mit Symbol und Farbe anlegen; sie gelten für alle.","Quem pagou":"Wer hat bezahlt","Já vem marcado com você. Troque se outra pessoa pagou a conta.":"Du bist schon ausgewählt. Ändere es, wenn jemand anderes bezahlt hat.","Como dividir":"Aufteilung","<b>Igual</b> entre os marcados, <b>Valores</b> exatos por pessoa ou <b>Partes</b> (um casal conta 2). A linha de baixo confirma a divisão.":"<b>Gleich</b> unter den Markierten, genaue <b>Beträge</b> pro Person oder <b>Anteile</b> (ein Paar zählt 2). Die Zeile darunter bestätigt die Aufteilung.","Repetir em parcelas":"In Raten wiederholen","Para conta que se repete (aluguel, mensalidade, parcelas do cartão): escolha <b>Toda semana</b> ou <b>Todo mês</b> e quantas vezes. O app lança cada uma na data certa.":"Für wiederkehrende Kosten (Miete, Monatsbeitrag, Kartenraten): wähle <b>Jede Woche</b> oder <b>Jeden Monat</b> und wie oft. Die App erfasst jede Rate am richtigen Datum.","Avisar o grupo":"Gruppe benachrichtigen","Ligado, os amigos veem a despesa em <b>Novidades</b> ao abrir o app, e você manda a imagem da despesa no WhatsApp.":"Wenn aktiviert, sehen deine Freunde die Ausgabe beim Öffnen der App unter <b>Neuigkeiten</b>, und du schickst das Bild der Ausgabe per WhatsApp.","Histórico do grupo":"Verlauf der Gruppe","Despesas e pagamentos por mês, do mais novo para o mais antigo. Toque para ver os detalhes. Só quem lançou <b>edita ou exclui</b>; os lançamentos dos outros aparecem com um cadeado.":"Ausgaben und Zahlungen nach Monat, die neuesten zuerst. Tipp für Details. Nur wer etwas erfasst hat, kann es <b>bearbeiten oder löschen</b>; Einträge anderer zeigen ein Schloss.","As abas":"Die Tabs","<b>Saldos</b>: quem paga quem e o Pix. <b>Resumo</b>: para onde foi o dinheiro. <b>Backup</b>: salvar e restaurar. <b>Ajustes</b>: sua conta e seu Pix. <b>Manual</b>: o passo a passo.":"<b>Salden</b>: wer wem zahlt und der Pix. <b>Übersicht</b>: wohin das Geld ging. <b>Backup</b>: sichern und wiederherstellen. <b>Einstellungen</b>: dein Konto und dein Pix. <b>Anleitung</b>: Schritt für Schritt.","O grupo na engrenagem":"Die Gruppe hinter dem Zahnrad","A engrenagem abre o grupo: <b>enviar o convite no WhatsApp</b> (qualquer pessoa) e, para quem criou, <b>remover pessoas</b>, mudar o nome e as categorias.":"Das Zahnrad öffnet die Gruppe: <b>Einladung per WhatsApp senden</b> (alle) und für die Person, die sie erstellt hat, <b>Personen entfernen</b>, Name und Kategorien ändern.","Tour quando quiser":"Tour jederzeit","O <b>?</b> repete o tour da tela em que você estiver.":"Das <b>?</b> wiederholt die Tour des aktuellen Bildschirms.","Acertos pendentes":"Offene Ausgleiche","Quanto falta acertar no grupo todo, quanto <b>você paga</b>, quanto <b>você recebe</b> e quantas pessoas já estão em dia.":"Wie viel in der ganzen Gruppe noch auszugleichen ist, wie viel <b>du zahlst</b>, wie viel <b>du bekommst</b> und wie viele schon ausgeglichen sind.","Saldo de cada um":"Saldo aller","Barra verde à direita: tem a receber. Barra vermelha à esquerda: tem a pagar. Quem não deve nada aparece com o <b>selo verde</b>.":"Grüner Balken rechts: bekommt Geld. Roter Balken links: muss zahlen. Wer nichts schuldet, hat das <b>grüne Abzeichen</b>.","Quem paga quem":"Wer zahlt wem","O app junta as dívidas e sugere o <b>menor número de Pix</b> para zerar o grupo. Nem sempre você paga para quem pagou a sua conta, mas o resultado é o mesmo.":"Die App fasst die Schulden zusammen und schlägt die <b>wenigsten Pix-Überweisungen</b> vor, um die Gruppe auszugleichen. Du zahlst nicht immer der Person, die deinen Teil bezahlt hat, aber das Ergebnis ist dasselbe.","Tudo acertado":"Alles ausgeglichen","Quando ninguém deve nada, os acertos somem. Ao lançar uma despesa nova, eles voltam.":"Wenn niemand etwas schuldet, verschwinden die Ausgleiche. Bei einer neuen Ausgabe kommen sie zurück.","Pix e registro":"Pix und Erfassung","<b>Pix</b> abre o QR Code e o <b>copia e cola já com o valor</b>. Depois de pagar no banco, toque em <b>Registrar pagamento</b>: o valor já vem preenchido com o que a pessoa deve.":"<b>Pix</b> öffnet den QR-Code und den <b>Copy-&-Paste-Code mit Betrag</b>. Nach dem Bezahlen in der Bank tipp auf <b>Zahlung erfassen</b>: Der Betrag ist schon mit der Schuld ausgefüllt.","Pagamentos registrados":"Erfasste Zahlungen","É o registro que baixa o saldo para todos. Pagou em dinheiro ou outro valor? Registre aqui.":"Erst die Erfassung senkt den Saldo für alle. Bar oder einen anderen Betrag bezahlt? Hier erfassen.","Período":"Zeitraum","Escolha um mês ou todo o período. Tudo abaixo se ajusta.":"Wähle einen Monat oder den ganzen Zeitraum. Alles darunter passt sich an.","Total gasto":"Gesamt ausgegeben","Total do período, média por pessoa, <b>sua parte</b>, quanto <b>você pagou</b> e a diferença entre os dois.":"Summe des Zeitraums, Durchschnitt pro Person, <b>dein Anteil</b>, wie viel <b>du bezahlt hast</b> und die Differenz.","Por categoria":"Nach Kategorie","Cada categoria na sua cor, do maior gasto para o menor, com o percentual do total.":"Jede Kategorie in ihrer Farbe, von der höchsten zur niedrigsten Ausgabe, mit dem Anteil an der Summe.","Por pessoa":"Nach Person","Quanto cada um pagou e consumiu no período. A diferença aqui não conta os pagamentos de acerto: para saber quem deve, use <b>Saldos</b>.":"Wie viel jede Person im Zeitraum bezahlt und verbraucht hat. Die Differenz hier zählt Ausgleichszahlungen nicht mit: wer schuldet, siehst du unter <b>Salden</b>.","Backups do grupo":"Backups der Gruppe","Quantas despesas e pagamentos o grupo tem e quando foi a última cópia automática neste aparelho.":"Wie viele Ausgaben und Zahlungen die Gruppe hat und wann die letzte automatische Kopie auf diesem Gerät entstand.","Salvar um backup":"Backup speichern","<b>.json</b> para restaurar depois; <b>Excel (.xlsx)</b> para ler, com abas, filtros e totais. No iPhone, salve em Arquivos ou no Google Drive.":"<b>.json</b> zum späteren Wiederherstellen; <b>Excel (.xlsx)</b> zum Lesen, mit Tabellenblättern, Filtern und Summen. Auf dem iPhone in Dateien oder Google Drive speichern.","Ler e restaurar":"Lesen und wiederherstellen","Qualquer pessoa lê um backup para conferir. Restaurar é só de quem criou o grupo, porque o backup traz os lançamentos de todos.":"Alle können ein Backup zum Prüfen lesen. Wiederherstellen kann nur, wer die Gruppe erstellt hat, denn das Backup enthält die Einträge aller.","Cópias automáticas":"Automatische Kopien","O app guarda até 8 versões do grupo neste aparelho, sozinho, sempre que os dados mudam.":"Die App bewahrt bis zu 8 Versionen der Gruppe auf diesem Gerät auf, automatisch bei jeder Änderung.","Salvos e lidos":"Gespeichert und gelesen","O registro do que foi exportado, lido e restaurado neste aparelho.":"Das Protokoll, was auf diesem Gerät exportiert, gelesen und wiederhergestellt wurde.","Sua foto":"Dein Foto","Toque para escolher uma <b>foto do iPhone</b> (e enquadrar no círculo) ou um <b>ícone</b> com cor.":"Tipp, um ein <b>iPhone-Foto</b> (und es im Kreis auszurichten) oder ein <b>Symbol</b> mit Farbe zu wählen.","Perfil e Pix":"Profil und Pix","Cadastre a sua <b>chave Pix</b>. Quem te deve recebe o código pronto, com o valor certo.":"Hinterlege deinen <b>Pix-Schlüssel</b>. Wer dir etwas schuldet, bekommt den fertigen Code mit dem richtigen Betrag.","E-mail e senha":"E-Mail und Passwort","<b>Trocar</b> o e-mail da conta (confirmado por um link no e-mail novo) ou a senha.":"<b>Ändere</b> die E-Mail des Kontos (bestätigt per Link an die neue Adresse) oder das Passwort.","Ligado, o app abre com o seu rosto neste iPhone e pede de novo depois de 5 minutos fora do app.":"Wenn aktiviert, öffnet sich die App auf diesem iPhone mit deinem Gesicht und fragt nach 5 Minuten außerhalb der App erneut.","Sair ou excluir a conta":"Abmelden oder Konto löschen","<b>Forçar sincronização</b> quando algo não subir, <b>Sair</b> deste aparelho ou <b>Excluir</b> a conta de vez.":"<b>Synchronisierung erzwingen</b>, wenn etwas nicht hochlädt, auf diesem Gerät <b>abmelden</b> oder das Konto endgültig <b>löschen</b>.","Escolha uma tela para conhecer, ou faça o tour completo.":"Wähle einen Bildschirm oder mach die ganze Tour.","Busca":"Suche","Digite uma palavra, como <b>Pix</b>, <b>parcelas</b> ou <b>Face ID</b>, para achar o trecho certo.":"Tipp ein Wort ein, zum Beispiel <b>Pix</b>, <b>Raten</b> oder <b>Face ID</b>, um die richtige Stelle zu finden.","Passo a passo":"Schritt für Schritt","Cada guia abre em etapas, com a figura do botão que você vai tocar.":"Jede Anleitung öffnet sich in Schritten, mit einem Bild der Taste, die du tippst.","Consulta rápida":"Kurzreferenz","O que cada parte do app faz, em poucas linhas.":"Was jeder Teil der App macht, in wenigen Zeilen.","Tour guiado":"Geführte Tour","· Nova despesa":"· Neue Ausgabe","Fechar o tour":"Tour schließen","Fechar":"Schließen","Pular":"Überspringen","Voltar":"Zurück","Concluir":"Fertig","Próximo":"Weiter","Tour concluído. O botão ? repete quando quiser.":"Tour beendet. Die Taste ? wiederholt sie jederzeit.","Código do grupo":"Gruppenco
