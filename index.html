const FORMS = {
  async login(f) {
    const em = f.email.value.trim(), pw = f.senha.value;
    S.lastEmail = em;
    if (!em || (store === FB && !pw)) { renderLogin('entrar', 'Preencha e-mail e senha.'); return; }
    busy(f, 'Entrando…'); S.justLogged = true;
    try { await store.signIn(em, pw); } catch (e) { S.justLogged = false; renderLogin('entrar', msgErro(e)); }
  },
  async signup(f) {
    const nome = f.nome.value.trim(), em = f.email.value.trim(), pw = f.senha.value, pw2 = f.senha2.value;
    S.lastEmail = em;
    if (!nome || !em) return renderLogin('criar', 'Preencha nome e e-mail.');
    if (pw.length < 6) return renderLogin('criar', 'A senha precisa ter pelo menos 6 caracteres.');
    if (pw !== pw2) return renderLogin('criar', 'As duas senhas não são iguais.');
    busy(f, 'Criando conta…');
    S.pendingName = nome;
    try {
      await store.signUp(nome, em, pw);
      if (S.user) { S.profile.nome = nome; render(); }
    } catch (e) { S.pendingName = ''; renderLogin('criar', msgErro(e)); }
  },
  async reset(f) {
    const em = f.email.value.trim(); S.lastEmail = em;
    if (!em) return renderLogin('reset', 'Digite o e-mail da sua conta.');
    if (store === Demo) return renderLogin('reset', 'Sem Firebase configurado nenhum e-mail é enviado. Configure o Firebase para ter recuperação de senha.', 'bad');
    busy(f, 'Enviando…');
    try { await store.resetPassword(em); renderLogin('entrar', 'Se existir uma conta com ' + em + ', enviamos um link para criar uma senha nova. Confira também o spam.', 'ok'); }
    catch (e) { renderLogin('reset', e && e.code === 'auth/user-not-found' ? 'Se existir uma conta com esse e-mail, o link foi enviado.' : msgErro(e), e && e.code === 'auth/user-not-found' ? 'ok' : 'bad'); }
  },
  async 'create-group'(f) {
    const nome = f.nome.value.trim(); if (!nome) return;
    busy(f, 'Criando…');
    const gid = store.newId();
    S.wantGid = gid;
    try { await store.createGroup(gid, nome, me(), S.profile); closeSheet(); onGroups(); toast('Grupo criado. Convide os amigos em Ajustes.'); }
    catch (e) { S.wantGid = null; toast(msgErro(e)); render(); }
  },
  'join-group'(f) { busy(f, 'Entrando…'); joinByCode(f.codigo.value).then(() => { if (f.isConnected) unbusy(f); }); },
  expense(f) {
    const desc = f.descricao.value.trim(), total = parseMoney(f.valor.value), data = f.data.value;
    if (!desc) return fail(f.descricao, 'Escreva uma descrição.');
    if (!(total > 0)) return fail(f.valor, 'Informe um valor maior que zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return fail(f.data, 'Informe a data.');
    const r = updateSplit(); if (!r.ok) { $('#ex-status').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const old = EXP.id ? S.expenses.find(x => x.id === EXP.id) : null, now = new Date().toISOString();
    const base = {
      descricao: desc, valor: total, data, categoria: (f.querySelector('input[name=categoria]:checked') || {}).value || 'outros',
      pagador: (f.querySelector('input[name=pagador]:checked') || {}).value || me(), modo: EXP.modo, divisao: r.map,
      criadoPor: old ? old.criadoPor || old.pagador : me(), criadoEm: old ? old.criadoEm || now : now, atualizadoEm: now, atualizadoPor: me(),
    };
    if (EXP.modo === 'partes') { base.pesos = {}; EXP.ids.forEach(u => { if (EXP.pesos[u] > 0) base.pesos[u] = EXP.pesos[u]; }); }
    LS.set('rateio.ultcat.' + S.gid, base.categoria);
    if (old) {
      if (old.serie) base.serie = old.serie;
      if (old.avisar) base.avisar = true;
      store.saveExpense(S.gid, EXP.id, base); closeSheet(); toast('Despesa atualizada'); return;
    }
    const avisar = !!($('#ex-avisar') || {}).checked;
    const n = EXP.rep.freq === 'nao' ? 1 : EXP.rep.n, serie = n > 1 ? 's_' + genId(8) : null, docs = [];
    for (let k = 0; k < n; k++) {
      const d = Object.assign({}, base, { data: n > 1 ? addPeriod(data, EXP.rep.freq, k) : data });
      if (serie) { d.serie = { id: serie, k: k + 1, n, freq: EXP.rep.freq }; d.descricao = desc + ' (' + (k + 1) + '/' + n + ')'; }
      if (avisar && k === 0) d.avisar = true;
      docs.push(d); store.saveExpense(S.gid, store.newId(), d);
    }
    closeSheet();
    if (avisar) openNotify(docs[0], n, desc, EXP.rep.freq);
    else celebrate(n > 1 ? n + ' lançamentos criados' : 'Despesa lançada', n > 1 ? 'De ' + fmtD(docs[0].data) + ' a ' + fmtD(docs[n - 1].data) + ', ' + brl(total) + ' cada' : desc + ' · ' + brl(total));
  },
  payment(f) {
    const de = f.de.value, para = f.para.value, valor = parseMoney(f.valor.value), data = f.data.value;
    if (de === para) return fail(f.para, 'Quem pagou e quem recebeu precisam ser pessoas diferentes.');
    if (!(valor > 0)) return fail(f.valor, 'Informe um valor maior que zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return fail(f.data, 'Informe a data.');
    const id = f.dataset.id, old = id ? S.payments.find(x => x.id === id) : null, now = new Date().toISOString();
    store.savePayment(S.gid, id || store.newId(), { de, para, valor, data, obs: f.obs.value.trim(), criadoPor: old ? old.criadoPor || me() : me(), criadoEm: old ? old.criadoEm || now : now, atualizadoEm: now });
    closeSheet();
    if (id) { toast('Pagamento atualizado'); return; }
    setTimeout(() => { const bb = balances(); celebrate('Pagamento registrado', (de === me() || para === me()) && (bb[me()] || 0) === 0 ? 'Você está em dia com o grupo.' : who(de) + ' → ' + who(para, true) + ' · ' + brl(valor)); }, 60);
  },
  profile(f) {
    const p = { nome: f.nome.value.trim(), pixTipo: f.pixTipo.value, pixChave: f.pixChave.value.trim(), pixNome: f.pixNome.value.trim(), pixCidade: f.pixCidade.value.trim() };
    if (!p.nome) return fail(f.nome, 'Escreva seu nome.');
    if (p.pixTipo && !validKey(p.pixTipo, p.pixChave)) return fail(f.pixChave, 'Essa chave não parece ser do tipo ' + PIX_TIPOS.find(t => t.id === p.pixTipo).nome + '. Confira.');
    if (!p.pixTipo) p.pixChave = '';
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    saveProfilePart(p); toast('Perfil salvo');
  },
  rename(f) {
    const nome = f.nome.value.trim(); if (!nome) return fail(f.nome, 'O grupo precisa de um nome.');
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    store.renameGroup(S.gid, nome); const g = group(); if (g) g.nome = nome; toast('Nome do grupo salvo'); changed();
  },
};
function busy(f, label) { const b = f.querySelector('button:not([type=button])'); if (b) { b.dataset.orig = b.innerHTML; b.textContent = label; b.disabled = true; } }
function unbusy(f) { const b = f.querySelector('button:not([type=button])'); if (b && b.dataset.orig) { b.innerHTML = b.dataset.orig; b.disabled = false; } }
function fail(input, msg) { toast(msg); try { input.focus(); } catch (e) {} }
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-f]'); if (!f) return;
  ev.preventDefault();
  const fn = FORMS[f.dataset.f]; if (fn) fn(f);
});

/* ================= Mudanças em campos ================= */
document.addEventListener('change', ev => {
  const t = ev.target, k = t.dataset.ch;
  if (k === 'exp-modo') { EXP.modo = t.value; renderSplit(); }
  else if (k === 'exp-rep') { EXP.rep.freq = t.value; $('#ex-rep').hidden = t.value === 'nao'; repPreview(); }
  else if (t.name === 'pagador' && EXP) updateSplit();
  else if (k === 'exp-part') { if (t.checked) EXP.part.add(t.value); else EXP.part.delete(t.value); updateSplit(); }
  else if (k === 'pg-par') {
    const f = t.form, v = $('#pg-valor'), h = $('#pg-sug');
    if (!f || f.dataset.id || !h) return;
    const sug = sugestaoPagamento(f.de.value, f.para.value);
    if (!v.dataset.manual) v.value = sug ? centsToInput(sug) : '';
    h.textContent = textoSugestao(f.de.value, f.para.value, sug);
  }
  else if (k === 'resumo-mes') { S.resumoMes = t.value; t.blur(); renderMain(); }
  else if (k === 'pix-tipo') { const i = $('#pf-chave'); if (i) i.placeholder = (PIX_TIPOS.find(x => x.id === t.value) || {}).ph || ''; }
  else if (k === 'av-file') {
    const file = t.files && t.files[0]; if (!file) return;
    readPhoto(file).then(foto => { saveProfilePart({ foto, avIc: '', avK: 0 }); closeSheet(); toast('Foto salva'); }).catch(e => toast(e.message));
  }
  else if (k === 'faceid') {
    if (t.checked) LOCK.enable().then(() => toast('Face ID ativado. Na próxima abertura o app pede o seu rosto.')).catch(e => { t.checked = false; toast(e && e.name === 'NotAllowedError' ? 'Face ID cancelado.' : 'Este aparelho não liberou o Face ID para o app.'); });
    else { LOCK.off(); toast('Face ID desativado'); }
  }
  else if (k === 'bk-file') {
    const file = t.files && t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { try { openRestore(parseBackup(String(rd.result)), 'Arquivo ' + file.name); } catch (e) { toast(e.message); } t.value = ''; };
    rd.onerror = () => toast('Não foi possível ler o arquivo.');
    rd.readAsText(file);
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.hasAttribute && t.hasAttribute('data-money')) maskMoney(t);
  if (t.id === 'ex-data') repPreview();
  if (t.id === 'ex-valor') { updateSplit(); qopsSync(); repPreview(); }
  else if (t.id === 'pg-valor') t.dataset.manual = t.value ? '1' : '';
  else if (t.id === 'man-q') {
    const had = !!norm(MAN.q); MAN.q = t.value;
    if (had && !norm(MAN.q)) GUIAS.forEach(g => { gvState(g.id).tudo = false; });
    $('#man-body').innerHTML = manBodyHtml();
  }
  else if (t.dataset && t.dataset.val && EXP) { EXP.valores[t.dataset.val] = t.value; updateSplit(); }
});
document.addEventListener('focusin', ev => { const t = ev.target; if (t.hasAttribute && t.hasAttribute('data-money') && t.value) setTimeout(() => { try { t.select(); } catch (e) {} }, 0); });
document.addEventListener('toggle', ev => { const d = ev.target; if (d && d.dataset && d.dataset.sec && !norm(MAN.q)) MAN.open[d.dataset.sec] = d.open; }, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheetOpen()) closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.hiddenAt = Date.now(); return; }
  if (S.user && !S.locked && LOCK.on() && S.hiddenAt && Date.now() - S.hiddenAt > 5 * 60 * 1000) { S.locked = true; closeSheet(); render(); }
});
['gesturestart', 'gesturechange'].forEach(n => document.addEventListener(n, ev => ev.preventDefault(), { passive: false }));
window.addEventListener('online', () => { S.online = true; renderSync(); });
window.addEventListener('offline', () => { S.online = false; renderSync(); });

/* ================= Início ================= */
(function captureInvite() {
  try {
    const q = new URLSearchParams(location.search).get('convite');
    if (q) { LS.set('rateio.convite', q.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6)); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
})();
async function boot() {
  renderLoading();
  Demo.init();
  LOCK.avail().then(v => { S.faceAvail = v; if (S.tab === 'ajustes' && $('#view')) changed(); });
  if (HAS_FB) {
    try { await FB.init(); }
    catch (e) { console.error(e); store = Demo; S.fbError = 'Não foi possível conectar ao Firebase. Verifique a internet e o arquivo firebase-config.js.'; }
  }
  if (store === FB) FB.onAuth(u => { if (store === FB) onUser(u); });
  Demo.onAuth(u => { if (store === Demo) onUser(u); });
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') { const had = !!navigator.serviceWorker.controller; let done = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } }); navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}); } } catch (e) {}
}
window.__wirteilen = { pixPayload, crc16, computeSplit, settle, parseMoney };
boot();
})();
</script>
